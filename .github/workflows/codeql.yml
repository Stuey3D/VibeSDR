# CodeQL — advanced setup.
#
# ★★★ WHY ADVANCED AND NOT DEFAULT. Default setup could not analyse java-kotlin: it tries to build
#     the Android app and reports only "unable to automatically build your code". Advanced setup
#     lets each language say HOW it is built, which is the only way to get a COMPILED analysis of
#     the Android code — and a compiled database sees data flow that a source-only one cannot.
#     The two are mutually exclusive: default setup must stay disabled for this to run.
#
# ★★ THE ANDROID BUILD NEEDS NODE BEFORE GRADLE, AND THAT IS THE WHOLE FIX. android/settings.gradle
#    resolves the React Native and Expo Gradle plugins by shelling out to
#    `node --print require.resolve(...)`, so with no node_modules that node process exits 1 and
#    Gradle cannot evaluate its own settings. The error underneath autobuild's generic message was
#    "A problem occurred evaluating settings 'android'. > Process 'command 'node'' finished with
#    non-zero exit value 1". Proved on its own in a throwaway workflow first: green in 10m10s.
#
# ★★ THREAT MODEL: REMOTE, matching the default config it replaces. This repo's crown jewels are
#    network-facing: VibeServer takes WebSocket frames, HTTP requests and rtl_tcp commands from
#    anyone who can reach it.
#
# ★ SWIFT NEEDS macOS — its extractor does not run on Linux — so that job alone takes a macOS
#   runner and the rest stay on Linux where they are cheaper.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 04:17 UTC — off the hour, so it does not queue behind everyone else's cron.
    - cron: '17 4 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 60 }}
    permissions:
      # ★ security-events: write is what lets the run upload its results. Without it the analysis
      #   succeeds and reports nothing, which looks exactly like a clean repository.
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: swift
            build-mode: autobuild
          # ★ VibeIQ (tools/vibeiq) is Go. It was scanned once, before this matrix existed, and never
          #   again — so fixed alert #2 (go/request-forgery, fixed in c28dfae8) stayed open against
          #   code that no longer exists. Built manually below: its go.mod is not at the repo root.
          - language: go
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchains, before init, so the manual builds below have what they need ──────────────
      - name: Set up Node
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        if: matrix.language == 'java-kotlin'
        run: npm ci

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # ★ 17 is what React Native 0.86 and Expo SDK 57 expect.
          java-version: 17
      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/vibeiq/go.mod
          cache: false

      - name: Install the radio libraries
        if: matrix.language == 'c-cpp'
        # ★ vibeserver/CMakeLists.txt refuses to configure without librtlsdr and libusb — it drives
        #   real hardware, so they are a hard requirement rather than an optional feature.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librtlsdr-dev libusb-1.0-0-dev libopus-dev cmake ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            threat-models: remote
            # ★★★ SCOPE, NOT SUPPRESSION. Everything excluded here is either NOT OURS or NOT
            #     SHIPPED. Nothing that runs on a listener's machine or on a VibeServer is
            #     excluded, and no finding in our own product code is silenced by this list — a
            #     real alert in main.ts, admin.ts, the app or the daemon still lands.
            #     The reason to scope at all: a security tab full of alerts in somebody else's
            #     Gradle plugin is a security tab nobody reads, and the ones that matter drown.
            paths-ignore:
              # Dependencies. We do not write them and cannot patch them here; upgrading is
              # Dependabot's job and that is where those findings belong.
              - node_modules
              - '**/node_modules'
              # Build output — generated from web/client, so a finding here is a duplicate of one
              # in the source that produced it.
              - web/dist
              - android/app/build
              # ★ Two static skins from 2026-07-11, referenced by nothing and served by nothing:
              #   the live client is web/client and the daemon embeds only what that builds. They
              #   are kept because one is Stuart's own earlier work, not because they run.
              - web/UberSDR_Pocket_v116.html
              - web/vibesdr_web_client_base_v6_3_1.html
              # Development and test harnesses. They run on a developer's machine against a
              # receiver they already control, take no untrusted input, and ship in nothing.
              - scripts

      # ── The manual builds. CodeQL traces whatever the compiler does between init and analyze ──
      - name: Build the Android app
        if: matrix.language == 'java-kotlin'
        working-directory: android
        # ★ ONE ABI, not two. The Java/Kotlin analysis does not care which native ABIs are built,
        #   and arm64-v8a alone halves the NDK compile — a CI scope choice, not a disabled check.
        run: ./gradlew assembleDebug --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Build VibeServer
        if: matrix.language == 'c-cpp'
        # ★ The previous autobuild ran from the repo ROOT, where there is no build system: it found
        #   nothing, compiled nothing, and finished in 35 s with "could not process any code". The
        #   CMake project lives in vibeserver/, and this builds it explicitly.
        run: |
          # ★★★ -DVIBESERVER_ALLOW_NO_TUNNEL=ON, OR CODEQL NEVER RUNS AT ALL.
          #     CMakeLists.txt refuses to configure without tools/cloudflared-desktop/bin/, and it
          #     is right to: a package built without it would REMOVE the tunnel from every machine
          #     that installed it, and a server behind CGNAT would lose its only address. The
          #     binary is fetched by fetch.sh and not committed, so a fresh CI clone never has it.
          # ★★ THE RESULT WAS NOT A NOISY FAILURE, IT WAS NO ANALYSIS. Every push failed at
          #    CONFIGURE, before a single line of C++ was scanned — so the server code, the part
          #    that faces the internet, has never actually been through CodeQL. A red tick that is
          #    ignored because "it does not affect things" is the most expensive kind.
          # ★ This flag is the escape hatch the guard's own error message names, and it is exactly
          #   right here: CodeQL analyses source, it never ships a package.
          cmake -S vibeserver -B vibeserver/build-codeql -DCMAKE_BUILD_TYPE=Release \
                -DVIBESERVER_ALLOW_NO_TUNNEL=ON
          cmake --build vibeserver/build-codeql -j "$(nproc)"

      - name: Build VibeIQ
        if: matrix.language == 'go'
        working-directory: tools/vibeiq
        run: go build ./...

      # ★★★ ANALYSE, FILTER, THEN UPLOAD — because paths-ignore above does NOT apply to a compiled
      #     language. For java-kotlin, c-cpp and swift the database holds whatever the BUILD compiled,
      #     and the Android build compiles every autolinked React Native module straight out of
      #     node_modules. That is how alerts #46-48 (react-native-svg, react-native-webview, expo's
      #     log-box) reached the security tab with `node_modules` already in paths-ignore.
      #     So the results are written to disk, anything located under a node_modules/ directory is
      #     dropped, and only then uploaded. Same scope rule as paths-ignore: NOT OURS.
      # ★★ What is deliberately NOT filtered: the vendored C/C++ under android/app/src/main/cpp
      #    (ft8_lib, libairspy, libairspyhf, vibedsp/third_party/pffft). Unlike node_modules they are
      #    committed here, compiled into the server and the apps we ship, and patched in-tree when
      #    needed (ft8_lib's monitor.c, 2026-09-28) — so a finding in them is one we can and must act on.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          upload: never
          output: sarif-results

      - name: Drop results in third-party dependencies
        run: |
          shopt -s nullglob
          for f in sarif-results/*.sarif; do
            before=$(jq '[.runs[].results[]?] | length' "$f")
            jq '.runs[].results |= map(select(
                  [.locations[]?.physicalLocation.artifactLocation.uri // ""]
                  | any(test("(^|/)node_modules/")) | not))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
            after=$(jq '[.runs[].results[]?] | length' "$f")
            echo "$f: $before results, $((before - after)) in node_modules dropped, $after kept"
          done

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          category: '/language:${{ matrix.language }}'
