apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.vibesdr.app'   // ★ the CODE package — unchanged; only the applicationId moves (see productFlavors)
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ★ RC4 (530) is above every com.vibesdr.app APK ever released on GitHub (the last was RC3, 529), so the
        //   legacy build installs over a sideload; net.vibesdr.app starts its own sequence at the same number.
        versionCode 552
        versionName "11.0"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    /* ★★★ TWO APPLICATION IDs FROM ONE CODEBASE (BRIEF-android-package-migration, 2026-10-04). The Play listing moves
     *  to a new account under net.vibesdr.app; GitHub follows it, and for ONE transitional release also ships the old
     *  id as "VibeSDR (legacy)" — its final update, installable over an existing sideload and side by side with the
     *  new app. Only the applicationId differs: namespace, Kotlin packages and JNI symbols stay com.vibesdr.app.
     *    ./gradlew :app:assembleCurrentRelease   → net.vibesdr.app  "VibeSDR"           (the only one from now on)
     *    ./gradlew :app:assembleLegacyRelease    → com.vibesdr.app  "VibeSDR (legacy)"  (final release)
     *  ★ legacy's label and its OLD icon (pre-11.0 rebrand, Stuart: "so that there is a visual difference for users")
     *    live in src/legacy/res and override main's. IS_LEGACY_PACKAGE drives the "new home" notice. */
    flavorDimensions 'pkg'
    productFlavors {
        current {
            dimension 'pkg'
            applicationId 'net.vibesdr.app'
            buildConfigField 'boolean', 'IS_LEGACY_PACKAGE', 'false'
        }
        legacy {
            dimension 'pkg'
            applicationId 'com.vibesdr.app'
            buildConfigField 'boolean', 'IS_LEGACY_PACKAGE', 'true'
        }
    }
    // Release/upload signing — loaded from android/keystore.properties (gitignored).
    // ★★★ A RELEASE WITHOUT THE UPLOAD KEY NOW FAILS (audit 2026-10-03). It used to fall back to
    //     the debug key — the PUBLIC React Native one, committed in every RN template — and build
    //     a "release" anyone could re-sign. The debug fallback below stays only so a fresh clone
    //     still CONFIGURES (CodeQL runs assembleDebug); requireUploadKey, wired into
    //     preReleaseBuild under the android block, stops any release task before it builds.
    def keystorePropsFile = rootProject.file("keystore.properties")
    def hasUploadKey = keystorePropsFile.exists()
    def keystoreProps = new Properties()
    if (hasUploadKey) { keystoreProps.load(new FileInputStream(keystorePropsFile)) }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasUploadKey ? signingConfigs.release : signingConfigs.debug
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    // App native build: RN New-Architecture setup + the V4 local-SDR shim.
    // The jni/CMakeLists.txt includes RN's ReactNative-application.cmake (so
    // libappmodules.so / core TurboModules are still built) and then adds the
    // shim from ../cpp. Pointing this at the shim directly would drop RN's
    // setup → "PlatformConstants could not be found" at launch.
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // V5 only links librtlsdr (the USB driver) + its libusb dependency. The old
    // SDR++ DSP deps (volk/fftw3f/zstd — volk/fftw being GPL) are no longer linked
    // and are deliberately NOT packaged. externalNativeBuild only packages libs it
    // builds, so the kit .so are flattened into a jniLibs dir below.
    sourceSets {
        main { jniLibs.srcDirs += ["${buildDir}/sdrkit-jniLibs", "${buildDir}/cloudflared-jniLibs"] }
    }
}

// ★★★ NO RELEASE ON THE DEBUG KEY. preReleaseBuild is the first task of every release variant
//     (assembleRelease, bundleRelease, installRelease…), so a missing android/keystore.properties
//     stops the build there with a message, instead of producing a debug-signed "release".
//     Debug builds never run preReleaseBuild and are unaffected.
def releaseHasUploadKey = rootProject.file("keystore.properties").exists()
tasks.register('requireUploadKey') {
    doLast {
        if (!releaseHasUploadKey) {
            throw new GradleException(
                "Release build refused: android/keystore.properties is missing, so there is no " +
                "upload key and the release would be signed with the PUBLIC debug key. Restore " +
                "keystore.properties (storeFile, storePassword, keyAlias, keyPassword) and retry.")
        }
    }
}
// ★ Every release variant's first task: preReleaseBuild, and per flavour preCurrentReleaseBuild / preLegacyReleaseBuild.
tasks.matching { it.name ==~ /pre\w*ReleaseBuild/ }.configureEach { dependsOn 'requireUploadKey' }

// Flatten the needed src/main/cpp/sdr-kit/<ABI>/lib/*.so -> build/sdrkit-jniLibs.
// V5: only librtlsdr + libusb (symlinks dereferenced to real files by Copy).
def sdrKitDir = file("src/main/cpp/sdr-kit")
def sdrKitJniLibs = file("${buildDir}/sdrkit-jniLibs")
tasks.register('copySdrKitLibs', Copy) {
    into sdrKitJniLibs
    ['arm64-v8a', 'armeabi-v7a'].each { abi ->
        from("${sdrKitDir}/${abi}/lib") {
            include 'librtlsdr.so'
            include 'libusb*.so'
            into abi
        }
    }
}
tasks.named('preBuild') { dependsOn 'copySdrKitLibs' }

// ── cloudflared: the public-listing tunnel ────────────────────────────────────────────────────
// ★★★ NOT A LIBRARY — AN EXECUTABLE, and libcloudflared.so is the only name Android will both
//     ship and let us run. filesDir is noexec (W^X, API 29+), so a binary copied there at runtime
//     cannot be started; files in nativeLibraryDir can. The .so suffix is what gets it packaged.
//     ★★ Requires expo.useLegacyPackaging=true, or the libraries are never extracted to disk and
//        nativeLibraryDir is EMPTY — verified on the Moto, see gradle.properties.
//
// ★★ arm64-v8a ONLY. On armeabi-v7a the switch is simply absent, per AGENTS.md: a control that
//    works on one target and not another should not be there at all.
//
// ★ NOT COMMITTED — it is 27 MB. tools/cloudflared-android/build.sh rebuilds it reproducibly from
//   a pinned upstream commit with our DNS patch (Android has no /etc/resolv.conf).
def cloudflaredSrc = file("src/main/cpp/cloudflared")
def cloudflaredJniLibs = file("${buildDir}/cloudflared-jniLibs")
tasks.register('copyCloudflared', Copy) {
    into cloudflaredJniLibs
    from("${cloudflaredSrc}/arm64-v8a") { include 'libcloudflared.so'; into 'arm64-v8a' }
    doFirst {
        // ★★★ FAIL LOUDLY. A missing binary would otherwise build a perfectly good APK whose
        //     "Advertise on VibeSDR.net" switch cannot work, and nothing would say why until a
        //     user flicked it.
        if (!file("${cloudflaredSrc}/arm64-v8a/libcloudflared.so").exists()) {
            throw new GradleException(
                "cloudflared is missing. Build it first:\n" +
                "  ./tools/cloudflared-android/build.sh " +
                "android/app/src/main/cpp/cloudflared/arm64-v8a/libcloudflared.so")
        }
    }
}
tasks.named('preBuild') { dependsOn 'copyCloudflared' }

// ★★★ The GPU map files the Android VibeServer serves at /mapgl/ — see mapgl-assets.gradle.
apply from: file('mapgl-assets.gradle')

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.media:media:1.7.0")
    // ★ 2026-10-05: media3-exoplayer / media3-session 1.4.1 removed. Nothing in this app imports
    //   androidx.media3 — VibeStreamService's lock-screen session is androidx.media (above) — and
    //   expo-audio brings its own media3 at the version IT was built against. A second, older pin
    //   here was dead weight at best and a version clash with expo-audio's at worst.
    // Android Auto connection state (PROJECTION/NATIVE) for car-only band-aware tuning
    implementation("androidx.car.app:app:1.4.0")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
