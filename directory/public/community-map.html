<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Map — VibeSDR</title>
<meta name="description" content="Aircraft, shipping, NAVTEX, radiosondes, APRS and MeshCore heard by VibeServer receivers around the world, on one map.">
<!-- ★★★ THE VibeSDR COMMUNITY MAP (Stuart, 2026-11-25). docs/v12/COMMUNITY-MAP.md (v12-experimental) has the design.
     ★★★ THIS PAGE IS THE ONLY THING THE WORKER SERVES FOR IT, plus one small list (/api/community). Everything drawn comes
         STRAIGHT FROM THE RECEIVER THAT HEARD IT, over that receiver's own tunnel (community-map.js dataUrl).
     ★★ LAYERED: the map and the receivers draw at once; each receiver's sections arrive in parallel (≤ 6 at a time) and are
        drawn as they come; a slow or dead one never holds up the rest. Numerous things are GPU layers (MapLibre GeoJSON),
        clustered when zoomed out. The icons and cards are the server maps' own (community-kit.js). -->
<link rel="stylesheet" href="/mapgl/vendor/maplibre-gl.css">
<style>
  /* ★★★ b97 THE MAP CARD SYSTEM (docs/v12/MAP-CONTROL-CARDS.md; map-chrome.js = web/client/src/mapChrome.ts, generated):
   *  the map takes the screen; ✕ (back to the directory) top-left; LAYERS / STATS / RECEIVERS / MAP CONTROLS chips pop out
   *  their cards; the LIST drawer (the NAVTEX messages and everything else on the map) bottom-left; HELP and the scale
   *  bottom-right. The old header rows, bars, FIT / KEY buttons, status line and side panels are gone (not hidden). Only
   *  what this page draws INSIDE the map and the cards is styled here: the cards (popups) and the receivers' rows. */
  :root { --accent: #ffb833; --line: rgba(255,176,0,.22); --dim: rgba(255,160,0,.55); --text: #ffcc88; --panel: #0d0a02;
          --free: #28A745; --busy: #e05050; --temp: #4fc3f7; --down: #6b7785; }
  html, body { margin: 0; height: 100%; background: #0b1014; color: #dfe7ef; touch-action: manipulation; }
  a { color: var(--accent); }
  /* the popups (the servers' own cards) */
  .maplibregl-popup { z-index: 6; }
  .maplibregl-popup-content { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-family: ui-monospace, Menlo, monospace; font-size: 12px; max-height: 60vh; overflow: auto; }
  .maplibregl-popup-tip { border-top-color: var(--line) !important; border-bottom-color: var(--line) !important; }
  .maplibregl-popup-close-button { color: var(--dim); font-size: 16px; }
  .pc .t, .trkCard .t { font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .pc .r, .trkCard .r { display: flex; gap: 8px; } .pc .k, .trkCard .k { color: var(--dim); min-width: 70px; }
  .pc .src { font-size: 10px; color: var(--dim); margin: 1px 0 3px; line-height: 1.35; }
  .pc .src a { color: var(--dim); }
  .pc .off { text-decoration: line-through; opacity: .7; }
  .pc .hb { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 5px; }
  .pc .hb div { display: flex; justify-content: space-between; gap: 10px; }
  .pc .sus { color: #ffcf7a; margin-top: 4px; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib.maplibregl-compact { background: rgba(0,0,0,0.6); color: #9fb0c2; font-size: 9px; }
  .maplibregl-ctrl-attrib a { color: #9fb0c2; }
  /* the RECEIVERS card's rows (LISTEN, ONLY THIS) and the LIST's opened NAVTEX message */
  .rxRow { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 9px 12px; border-bottom: 1px solid #151f29; cursor: pointer; }
  .rxRow:hover, .rxRow:focus-visible { background: #1a2632; outline: none; }
  .rxRow.sel { box-shadow: inset 3px 0 0 #ffd34d; background: #1a2632; }
  .rxRow .nm { font-weight: 600; overflow-wrap: anywhere; }
  .rxRow .where, .rxRow .now { font-size: 11px; color: #93a3b4; }
  .rxRow .st { font-size: 11px; } .rxRow .st.free { color: var(--free); } .rxRow .st.busy { color: var(--busy); } .rxRow .st.temp { color: var(--temp); } .rxRow .st.down { color: var(--down); }
  .rxRow .lays { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
  .rxRow .lay { font-size: 10px; border: 1px solid #33475a; border-radius: 999px; padding: 1px 7px; display: inline-flex; gap: 4px; align-items: center; }
  .rxRow .lay i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .rxRow .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .rxRow .listen { font: 700 11px/1 system-ui, sans-serif; letter-spacing: .08em; padding: 7px 10px; border-radius: 6px; background: #ffd34d; color: #111; text-decoration: none; white-space: nowrap; }
  .rxRow.down .listen { background: transparent; color: #8596a7; border: 1px solid #33475a; }
  .rxEmpty { padding: 12px; color: #93a3b4; font-size: 12px; }
  .trkRow .nvTx { grid-column: 1 / -1; white-space: pre-wrap; margin: 6px 0 2px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #dfe7ef; max-height: 260px; overflow: auto; cursor: text; }
  .cmSel { display: flex; flex-wrap: wrap; gap: 4px; }
  .cmSel select { background: #1e2a36; color: #e8eef5; border: 1px solid #33475a; border-radius: 6px; padding: 5px 8px; font: 600 12px system-ui, sans-serif; }
  .kr { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  .kr > :first-child { flex: none; width: 24px; display: flex; justify-content: center; align-items: center; }
  .kr > span:last-child { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: normal; }
  .kr svg { max-width: 24px; max-height: 24px; }
  .kr svg[viewBox="0 0 40 40"] { max-width: 28px; max-height: 28px; margin: -2px; }
  .ks { color: #ffd34d; font-weight: 700; letter-spacing: .1em; font-size: 10px; margin: 8px 0 3px; }
  .ks:first-child { margin-top: 0; }
</style>
</head>
<body>
<!-- ★★★ b97: no header, bars or panels — map-chrome.js draws the chips and cards around the map (mountMapChrome, hostMap) -->
<noscript>The community map needs JavaScript. <a href="/">Back to the directory</a>.</noscript>

<script src="/mapgl/vendor/maplibre-gl.js"></script>
<script src="/mapgl/vendor/pmtiles.js"></script>
<script src="/mapgl/vendor/vibemapgl.js"></script>
<script src="/mapgl/vibemap-style.js"></script>
<script src="/mapgl/vibemap-water.js"></script>
<script src="/community-kit.js"></script>
<script src="/community-map.js"></script>
<script src="/map-chrome.js"></script>
<script>
'use strict';
const T0 = performance.now();
const CM = window.CommunityMap, KIT = window.CommunityKit;
const $ = (id) => document.getElementById(id);
const esc = CM.esc;
const perf = { listDraw: 0, firstData: 0, firstDraw: 0, full: 0, bytes: {} };   // ★ ms from the page starting: the receivers listed, the first receiver's data in, the GPU map's first draw, every receiver in

/* ══ THE MAP — the directory's GPU map (VibeMapGL), drawn with MapLibre layers directly. ★★★ b97: made in the card system's
 *  holder (map-chrome.js — mountMapChrome's hostMap), which keeps its scale chip, the credits' fold and the shared AUTO / FIT
 *  (mapAutoFit.ts, as every server map) on it ══ */
let gl = null, GLVM = null;
function makeMap(holder) {
  try {
    const load = (p, kind) => fetch(p).then((r) => (r.ok ? (kind === 'text' ? r.text() : r.arrayBuffer()) : null)).catch(() => null);
    GLVM = VibeMapGL.createNow(holder, { style: window.VM_STYLE, load, base: '/mapgl/', rangeBase: location.origin + '/mapgl/', profile: 'aero', center: [0, 40], zoom: 1.4, scale: false });
    gl = GLVM && GLVM.map;
    // ★★ the wide rivers, canals and docks as WATER, so ships sit on it (Stuart 11-25) — mapgl/vibemap-water.js
    if (GLVM && window.VibeWater) VibeWater.attach(GLVM, location.origin + '/mapgl/vibemap-water.pmtiles');
    if (gl) gl.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
  } catch (e) { console.error('GPU map unavailable: ' + e); }
  if (!gl) { MC.view.note('This map needs WebGL 2, which this browser does not offer.'); return null; }
  gl.on('zoomend', metZoom);
  gl.on('load', scheduleRender);
  // ★ the scale chip reads a Leaflet-zoom map (MapLibre's zoom + 1 — 512 px tiles)
  const scaleMap = { getCenter: () => gl.getCenter(), getZoom: () => gl.getZoom() + 1,
    on: (evs, f) => { for (const e of String(evs).split(/\s+/)) if (e) gl.on(e === 'zoomend' ? 'zoom' : e === 'moveend' ? 'move' : e, f); } };
  return { map: scaleMap, fitMap: gl, gl: GLVM, points: () => fitPoints().map(([lo, la]) => [la, lo]), receiver: () => null,
           maxZoom: 10, what: 'item shown', destroy: () => {} };
}

/* ══ STATE (remembered per viewer, try/catch) ══ */
const PREF_KEY = 'vibesdr.communityMap.v2';
let prefs = {};
try { prefs = JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {}; } catch { prefs = {}; }
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch { /* private window */ } };
const F = {
  groups: new Set(Array.isArray(prefs.groups) ? prefs.groups.filter((g) => CM.GROUPS.some((x) => x.id === g)) : CM.GROUPS.map((g) => g.id)),
  off: new Set(Array.isArray(prefs.off) ? prefs.off : []),   // ★ chips switched off — remembered even while their group is off
  maxAge: CM.AGES.some((a) => a.s === prefs.maxAge) ? prefs.maxAge : 86400, server: '',
  nav: { layers: new Set(Array.isArray(prefs.navLayers) ? prefs.navLayers : ['stations', 'warnings', 'weather', 'messages']), types: null, station: '' },
};
if (Array.isArray(prefs.navTypes)) F.nav.types = new Set(prefs.navTypes);
let SERVERS = [];
const DATA = new Map();   // server id → { sections: {key → value}, items }
let listAt = 0, selected = '', ITEMS = [], SHOWN = [], PRESENT = [];

/** The layers switched on now (group on, chip on, somebody shares it). */
const layersOn = () => PRESENT.filter((m) => F.groups.has(CM.MODE[m].group) && !F.off.has(m));
/** Every layer the viewer has on, shared yet or not — what a radio not yet heard from is asked for (CM.askFor). */
const wantedLayers = () => CM.MODES.filter((m) => F.groups.has(m.group) && !F.off.has(m.id)).map((m) => m.id);

/* ══ READING — /api/community once (then every LIST_SEC), each receiver directly, ≤ CONCURRENT at a time ══ */
async function loadList() {
  try {
    const r = await fetch('/api/community', { cache: 'no-cache' });
    const j = await r.json();
    const keep = new Map(SERVERS.map((s) => [s.id, s]));
    SERVERS = (Array.isArray(j.servers) ? j.servers : []).filter((s) => s && typeof s.id === 'string').map((s) => Object.assign(keep.get(s.id) || {}, s));
    for (const id of [...DATA.keys()]) if (!SERVERS.some((s) => s.id === id)) DATA.delete(id);
    listAt = Date.now();
  } catch { if (!SERVERS.length) MC.view.note('The directory could not be reached. Trying again shortly.'); }
}
let inFlight = 0; const queue = [];
function pump() {
  while (inFlight < CM.CONCURRENT && queue.length) { const job = queue.shift(); inFlight++; job().finally(() => { inFlight--; pump(); }); }
}
/** ★ One request: server `s`, target `t` (the server itself, or one of its radios — CM.targets). Each target keeps its own
 *  sections; the server's items are its radios' merged (CM.mergeRadios), so it is ONE receiver however many radios answer. */
function fetchOne(s, layers, t) {
  t = t || s;
  return new Promise((done) => {
    queue.push(async () => {
      const rid = t === s ? '' : t.rid;
      const u = CM.dataUrl(s, location.protocol, layers, rid);
      if (!u) { s.unreachable = true; s.why = 'no https address'; s._retryAt = Infinity; done(); return; }
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), CM.FETCH_TIMEOUT_MS);
      // ★★ the server's entry is looked up AFTER each answer, never held across the await: its radios answer in parallel, and
      //    a copy taken before would let the last one to land overwrite the others' (the Pi 500's aircraft vanished so, live)
      const entry = () => DATA.get(s.id) || { radios: new Map() };
      try {
        // ★ no-cache = revalidate: an unchanged answer is a 304 (its ETag) — a quiet minute costs bytes, not a body
        const r = await fetch(u, { signal: ctrl.signal, cache: 'no-cache', credentials: 'omit' });
        const text = r.ok ? await r.text() : '';
        const j = text ? JSON.parse(text) : null;
        if (j && j.on === true) {
          const d = entry();
          const one = d.radios.get(rid) || { sections: {} };
          for (const k of CM.sectionsOf(layers)) delete one.sections[k];   // ★ what was asked and is absent is now empty
          for (const k of Object.keys(j)) if (!['v', 'on', 'now', 'layers', 'dropped'].includes(k)) one.sections[k] = j[k];
          one.items = CM.itemsOf(Object.assign({ on: true, now: j.now }, one.sections), { id: s.id, name: s.name, rid });
          d.radios.set(rid, one); DATA.set(s.id, d);
          if (t !== s && Array.isArray(j.layers)) t.layers = j.layers.filter((l) => CM.MODE[l]);   // ★ what this radio shares
          d.now = j.now;
          perf.bytes[s.id] = (perf.bytes[s.id] || 0) + text.length;
          CM.noteResult(t, true, Date.now(), layers);
        } else { CM.noteResult(t, false, Date.now(), layers); t.why = j && j.why === 'off' ? 'stopped sharing' : 'not responding'; entry().radios.delete(rid); }
      } catch { CM.noteResult(t, false, Date.now(), layers); t.why = 'not responding'; }
      finally {
        clearTimeout(timer);
        // ★ the server is up while any of its radios answers; "not responding" only when none does
        if (t !== s) { const rx = s._rx || []; s.unreachable = rx.length > 0 && rx.every((x) => x.unreachable); s.why = s.unreachable ? (rx[0].why || 'not responding') : ''; }
        else if (!s.unreachable) s.why = '';
        const d = entry();
        if (d.radios.size) { d.items = CM.mergeRadios([...d.radios.values()].map((x) => x.items || [])); DATA.set(s.id, d); } else DATA.delete(s.id);
        scheduleRender(); done();
      }
    });
    pump();
  });
}
let busy = false;
async function tick(force, only) {
  if (document.hidden && !force) return;   // ★★★ nothing while nobody is looking
  if (busy && !only) return;
  busy = true;
  try {
    if (!listAt || Date.now() - listAt >= CM.LIST_SEC * 1000) { await loadList(); PRESENT = CM.modesPresent(SERVERS, ITEMS); render(); }
    const all = wantedLayers(), nowMs = Date.now();
    const jobs = [];
    for (const s of SERVERS) for (const t of CM.targets(s)) {
      // ★ a chip switched on (only): that layer now, from each target that may share it, unless it is backing off
      const can = t === s ? (s.layers || []) : t.layers || all;
      const want = only ? (t._retryAt > nowMs ? [] : only.filter((l) => can.includes(l))) : CM.askFor(t, s, all, nowMs);
      if (want.length) jobs.push(fetchOne(s, want, t));
    }
    await Promise.all(jobs);
    if (!perf.full && SERVERS.length && SERVERS.every((s) => DATA.has(s.id) || s.unreachable)) perf.full = Math.round(performance.now() - T0);
  } finally { if (!only) busy = false; }
}

/* ══ ICONS → GPU images (the server maps' own SVGs, rasterised once each) ══ */
const iconNames = new Map(); const iconWaits = [];
function icon(html) {
  // ★ a rotation or opacity in the SVG's style becomes the layer's icon-rotate / icon-opacity, so one image serves every angle
  const plain = String(html).replace(/\sstyle="[^"]*"/, '');
  let name = iconNames.get(plain);
  if (name) return name;
  name = 'ic' + iconNames.size;
  iconNames.set(plain, name);
  const svg = plain.includes('xmlns=') ? plain : plain.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  const w = Number((/width="(\d+(?:\.\d+)?)"/.exec(svg) || [])[1]) || 24, h = Number((/height="(\d+(?:\.\d+)?)"/.exec(svg) || [])[1]) || 24;
  iconWaits.push(new Promise((res) => {
    const img = new Image(w * 2, h * 2);
    img.onload = () => {
      try { const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2; const x = c.getContext('2d'); x.drawImage(img, 0, 0, w * 2, h * 2);
            if (gl && !gl.hasImage(name)) gl.addImage(name, x.getImageData(0, 0, w * 2, h * 2), { pixelRatio: 2 }); } catch (e) { console.warn('icon', e); }
      res();
    };
    img.onerror = () => res();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }));
  return name;
}
const rotOf = (html) => Number((/rotate\((-?[\d.]+)deg\)/.exec(html) || [])[1]) || 0;
const AC_SVG = (c) => `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 L13.4 9 L21 13.5 L21 15.2 L13.4 12.8 L13 18.5 L15.5 20.3 L15.5 21.6 L12 20.7 L8.5 21.6 L8.5 20.3 L11 18.5 L10.6 12.8 L3 15.2 L3 13.5 L10.6 9 Z" fill="${c}" stroke="#0b1014" stroke-width="1.1"/></svg>`;
/* ★★ THE RECEIVER IS THE DIRECTORY MAP'S LITTLE VibeSDR RADIO (Stuart 11-25: "make that dot the little radio glyph that is
 *  on the directory map please, for continuity") — index.html radioGlyph / padlockGlyph, the same strokes at the same 24 px,
 *  in the same state colours (green free slot, red full, blue temporary share, grey not responding; the yellow padlock for a
 *  PIN). Its drop shadow is drawn as a dark under-stroke (a GPU icon is an image: a CSS filter does not survive). SELECTED:
 *  an amber plate behind it, as the RECEIVERS list's selected row. */
const STATE_COL = { free: '#28A745', busy: '#e05050', temp: '#4fc3f7', down: '#6b7785', unknown: '#ffb000' };   // index.html's own
const RADIO_PATHS = (col) => `<rect x="3" y="8.5" width="18" height="12.5" rx="1.5"/><circle cx="8.6" cy="14.8" r="2.9"/>`
  + `<path d="M14.2 11.6v6.4M16.8 11.6v6.4M19.2 11.6v6.4"/><path d="M14.6 8.5 19.3 3.2"/>` + (col ? `<circle cx="8.6" cy="14.8" r="1" fill="${col}" stroke="none"/>` : '');
const LOCK_PATHS = (col) => `<rect x="5" y="10.5" width="14" height="10.5" rx="2"${col ? ` fill="${col}" fill-opacity=".22"` : ''}/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>`
  + (col ? `<circle cx="12" cy="15.8" r="1.2" fill="${col}" stroke="none"/>` : '');
function RX_SVG(s, sel) {
  const st = CM.stateOf(s), pin = !!s.pin && !s.unreachable;
  const col = pin ? '#ffd23f' : STATE_COL[st.cls] || STATE_COL.unknown, P = pin ? LOCK_PATHS : RADIO_PATHS;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="-1 -1 26 26">`
    + (sel ? `<rect x="-0.5" y="-0.5" width="25" height="25" rx="5" fill="rgba(255,184,51,0.30)" stroke="#ffb833" stroke-width="1.5"/>` : '')
    + `<g fill="none" stroke="rgba(0,0,0,0.85)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">${P('')}</g>`
    + `<g fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P(col)}</g></svg>`;
}
/* ★★ beta96 THE AIRCRAFT's OWN GLYPH (Stuart 11-26: "can they be the correct icon for the aircraft type like the ADS-B map"):
 *  the ADS-B map's class silhouettes — jet, heavy, 757, regional / turboprop, light, helicopter, fast jet, glider, balloon … —
 *  chosen by its own rule (KIT.aircraftIconClass = adsblayer.js iconClassOf: the aircraft data a beta96 server sends, else
 *  the type alone, else the jet), the same shapes (KIT.aircraftIconSvg), in the mode's colour, pointing along its track.
 *  AC_SIZE: the 40-unit box at 34 px puts the airliner at the old silhouette's 22 px; a heavy reads bigger, a Cessna smaller. */
const AC_SIZE = 34, AC_NO_ROT = new Set(['balloon', 'parachute', 'obstacle']);
const acClass = (d) => (KIT && KIT.aircraftIconClass ? KIT.aircraftIconClass(d || {}) : 'jet');
const acGlyph = (cls, colour, size) => (KIT && KIT.aircraftIconSvg ? KIT.aircraftIconSvg(cls, colour, size || AC_SIZE, 0) : AC_SVG(colour));
/** The icon an item draws, and its rotation — the servers' own (kit), aircraft its class's glyph in its mode's colour. */
function iconOf(it) {
  const m = CM.MODE[CM.primaryMode(it, F.off)];   // ★ the same rule as the pills' totals
  if (it.kind === 'aircraft') { const c = acClass(it.d); return { ic: icon(acGlyph(c, m.colour)), rot: AC_NO_ROT.has(c) ? 0 : (it.d.trk || 0) }; }
  if (!KIT) return { ic: icon(`<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="${m.colour}" stroke="#000"/></svg>`), rot: 0 };
  let h;
  if (it.kind === 'ship') h = KIT.aisIcon({ kind: it.d.vkind, family: it.d.family, sog: it.d.sog, cog: it.d.cog, mmsi: it.d.mmsi }).html;
  else if (it.kind === 'aprs') h = KIT.aprsIcon({ kind: it.d.akind, sym: it.d.sym }).html;
  else if (it.kind === 'mesh') h = KIT.ismMapIcon({ kind: 'meshcore', ntype: it.d.ntype, approx: it.d.approx ? 1 : undefined, seen: 0 }).html;
  else if (it.kind === 'sonde') h = KIT.sondeIcon({ climb: it.d.climb }).html;
  else if (it.kind === 'dsc') h = KIT.dscIcon(it.d.level).html;
  else if (it.kind === 'navst') { const site = KIT.navSites({ stations: [Object.assign({}, it.d, { seen: 0 })] })[0]; h = KIT.navIcon(site).html; }
  else h = `<svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1 L13 7 L7 13 L1 7 Z" fill="${m.colour}" stroke="#0b1014" stroke-width="1.2"/></svg>`;   // NDB / VOR
  return { ic: icon(h), rot: rotOf(h) };
}

/* ══ DRAWING (GPU) ══ */
/* ★★★ b97 ZOOMED OUT STAYS RICH (Stuart's recording 11-27: "the map starts looking barren as you zoom out" — one step out and
 *  ~150 MeshCore squares round London became a few plain yellow discs, aircraft and mesh merged into one):
 *   1. EACH DENSE LAYER CLUSTERS ON ITS OWN (a source per kind: mesh with mesh, aircraft with aircraft) — the same rule as
 *      before (clusterMaxZoom 5, radius 22), so one busy layer never swallows the others;
 *   2. A CLUSTER IS DRAWN AS ITS CONTENTS: the glyph of its commonest sub-kind (the MeshCore repeater square, the aircraft in

  h += `<div class="kr" style="opacity:.75"><span>◐</span><span>Anything faded was heard longer ago, within its mode’s window (HEARD IN)</span></div>`;
  return h;
}
/* ══ ★★★ b97 THE CARD SYSTEM — mounted once; the map is made in its holder (makeMap) when it shows ══ */
const MC = VibeMapChrome.mountMapChrome({
  title: 'COMMUNITY MAP', exitLabel: 'Back to the directory', listTitle: 'MESSAGES', profile: 'aero',
  onExit: () => { location.href = '/'; },
  // the item drawing is this page's own (MapLibre layers, the servers' cards) — the chrome draws none
  icon: () => ({ html: '', w: 0, h: 0 }), label: () => '', card: () => '',
  hostMap: makeMap,
});
MC.chips({ layers: true, stats: true });
MC.retitle('servers', 'RECEIVERS');
// ★ the old footer's words (privacy: where a receiver is drawn) — HELP's credit line now
MC.credit('Shared by VibeServer owners who switched on “Share to the VibeSDR community map”. What the stations themselves broadcast, read straight from each receiver; a receiver is drawn at the centre of its four-character grid square, never its address.');
MC.onRow(listRow);
rxWire(); ctlWire();
MC.show(null);

/* ══ THE CLOCK — a floor on every fetch, nothing while hidden ══ */
tick(true);
setInterval(() => tick(false), 15000);   // ★ wakes every 15 s; each receiver is asked only when its layers are due (60 s / 5 min)
setInterval(() => { if (!document.hidden) scheduleRender(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(false); });
if (new URLSearchParams(location.search).get('receivers') === '1') MC.card('servers', true);
</script>
