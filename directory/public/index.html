<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeServer Directory — VibeSDR</title>
<meta name="description" content="Public VibeServer receivers you can listen to right now.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0b0f14; --panel: #131a23; --line: #23303f;
    --text: #e6edf3; --dim: #8b9bb0; --accent: #4fc3f7;
    --free: #35d07f; --busy: #ff5c5c; --temp: #ffc14d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
  #map { height: 46vh; min-height: 300px; background: #0d1520; }
  main { padding: 16px 20px 60px; max-width: 900px; margin: 0 auto; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--dim);
            font-size: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px;
              vertical-align: -1px; }
  /* ★ SHAPE AS WELL AS COLOUR. Red/green is the commonest form of colour blindness and this
     legend is entirely red/green/yellow, so the shape carries the same information. */
  .sh-free { background: var(--free); border-radius: 50%; }
  .sh-busy { background: transparent; border: 2px solid var(--busy); border-radius: 50%; }
  .sh-temp { background: var(--temp); transform: rotate(45deg); }
  /* ★ Hollow and grey, and a different SHAPE again — a server that is not answering reads as
     absent rather than as another flavour of busy. */
  .sh-down { background: transparent; border: 2px solid #6b7785; }
  .srv.down > summary { opacity: 0.55; }

  .country { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px;
             background: var(--panel); overflow: hidden; }
  .country > summary { cursor: pointer; padding: 12px 14px; font-weight: 600;
                       display: flex; align-items: center; gap: 10px; list-style: none; }
  .country > summary::-webkit-details-marker { display: none; }
  .country > summary .n { color: var(--dim); font-weight: 400; font-size: 13px; }
  .chev { margin-left: auto; color: var(--dim); transition: transform .15s; }
  details[open] > summary .chev { transform: rotate(90deg); }

  .srv { border-top: 1px solid var(--line); }
  .srv > summary { cursor: pointer; padding: 11px 14px 11px 18px; display: flex;
                   align-items: center; gap: 10px; list-style: none; }
  .srv > summary::-webkit-details-marker { display: none; }
  .dot { width: 10px; height: 10px; flex: 0 0 auto; }
  .srv .meta { color: var(--dim); font-size: 12px; margin-left: auto; text-align: right; }
  .body { padding: 4px 14px 14px 42px; }
  .radio { border-top: 1px dashed var(--line); padding: 9px 0; font-size: 13px; }
  .radio b { font-weight: 600; }
  .radio .cap { color: var(--dim); }
  .listen { display: inline-block; margin-top: 10px; padding: 7px 14px; border-radius: 7px;
            background: var(--accent); color: #06121a; text-decoration: none; font-weight: 600;
            font-size: 13px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--line);
         color: var(--dim); }
  .empty { color: var(--dim); text-align: center; padding: 40px 20px; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
  a { color: var(--accent); }
  footer { color: var(--dim); font-size: 12px; text-align: center; padding: 0 20px 30px; }
</style>
</head>
<body>

<header>
  <h1>VibeServer <span>Directory</span></h1>
  <div class="sub">Public receivers you can listen to right now. Anyone running VibeServer can list
    theirs from the app — see <a href="https://vibesdr.net">vibesdr.net</a>.</div>
</header>

<div class="legend">
  <span><i class="sh-free"></i>Free slot</span>
  <span><i class="sh-busy"></i>No slots</span>
  <span><i class="sh-temp"></i>Temporary share</span>
  <span style="margin-left:auto" id="count"></span>
</div>

<div id="map"></div>

<main>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<footer>
  Positions are the operator's Maidenhead square — a grid square, not an address.
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@joergdietrich/leaflet.terminator@1.1.0/L.Terminator.js"></script>
<script>
// ★★★ THE GREYLINE IS NOT DECORATION FOR THIS AUDIENCE — IT IS INFORMATION. A DXer can see which
//     receivers are sitting in enhanced propagation right now, which is a reason to click one
//     rather than a background texture.

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** ★ A two-letter country code to its flag, via regional indicator symbols. No image assets. */
function flag(cc) {
  if (!/^[A-Z]{2}$/.test(cc || '')) return '🌐';
  return String.fromCodePoint(...[...cc].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
}

let countryNames = null;
try { countryNames = new Intl.DisplayNames(['en-GB'], { type: 'region' }); } catch { /* older browser */ }
const countryName = (cc) => {
  if (!/^[A-Z]{2}$/.test(cc || '')) return 'Elsewhere';
  try { return countryNames ? countryNames.of(cc) : cc; } catch { return cc; }
};

/** Free / busy / temporary — the three states the legend names. */
function state(s) {
  // ★ Checked first: an unreachable server is not free, not busy and not a temporary share — it
  //   is simply not answering, and that is what a listener needs to know before clicking.
  if (s.unreachable) {
    return { cls: 'sh-down', colour: '#6b7785', label: 'not responding' };
  }
  // ★★★ THE SERVER SAYS SO — never inferred from the ping interval. It WAS, and so every ordinary
  //     listing came out a "temporary share": the default TTL is thirty minutes, well inside the
  //     window this used to guess with. A product concept must not be invented out of a timing
  //     value. A temporary share is a different KIND of entry, not a level of busy, so it still
  //     wins the shape.
  const temporary = !!s.temporary;
  const full = s.maxListeners > 0 && s.listeners >= s.maxListeners;
  if (full) return { cls: 'sh-busy', colour: getComputedStyle(document.documentElement).getPropertyValue('--busy').trim(), label: 'no free slot' };
  if (temporary) return { cls: 'sh-temp', colour: getComputedStyle(document.documentElement).getPropertyValue('--temp').trim(), label: 'temporary share' };
  return { cls: 'sh-free', colour: getComputedStyle(document.documentElement).getPropertyValue('--free').trim(), label: 'free slot' };
}

const map = L.map('map', { worldCopyJump: true, scrollWheelZoom: true }).setView([30, 0], 2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 12,
}).addTo(map);

// The day/night shadow, refreshed so it stays honest on a page left open.
let term = null;
try {
  term = L.terminator({ fillOpacity: 0.28, color: '#000', weight: 0 });
  term.addTo(map);
  setInterval(() => { try { term.setTime(new Date()); } catch {} }, 60000);
} catch { /* terminator plugin unavailable — the map is still useful */ }

/**
 * ★★★ ALWAYS SEND A LISTENER TO THE STABLE ADDRESS, NEVER THE TUNNEL.
 *
 * The tunnel hostname rotates on every restart and a browser keys localStorage by ORIGIN, so a
 * listener who arrives on the raw tunnel URL loses every view setting the moment the server comes
 * back. The stable address serves the same page and tells it where the receiver is, so the
 * settings survive. Linking straight to s.url quietly threw that away for everyone who came
 * through this page rather than a shared link (Stuart, 2026-08-22).
 * ★ Falls back to the published URL for an entry with no address — a directly reachable server
 *   that never needed a tunnel.
 */
function listenUrl(s) {
  return s.address ? `https://${s.address}/` : s.url;
}

/**
 * One radio, as a listener would ask about it: what it is, what it can hear, whether there is room,
 * and how long they get. Stuart's own entry, 2026-08-22:
 *   RTL-SDR v4 · FM broadcast · 0/10 slots · 30 minute limit
 * ★ Anything the server did not say is simply omitted — never guessed, never "unknown".
 */
function radioLine(r, s) {
  const bits = [];
  if (r.driver) bits.push(esc(r.driver));
  if (Array.isArray(r.coverage) && r.coverage.length) {
    bits.push(r.coverage.map((c) => esc(c)).join(', '));
  } else if (r.mode) bits.push(esc(r.mode));
  // ★★ SLOTS BELONG WITH THE RADIO, not buried in the header — "is there room for me" is the
  //    question that decides whether a listener clicks at all.
  if (s && s.maxListeners > 0) bits.push(`${s.listeners}/${s.maxListeners} slots`);
  if (s && s.limitMin > 0) bits.push(`${s.limitMin} minute limit`);
  if (r.shared) bits.push('shared window');
  if (r.restricted) bits.push('restricted range');
  return `<div class="radio"><b>${esc(r.name || 'Radio')}</b>
    <div class="cap">${bits.join(' · ') || 'no details published'}</div></div>`;
}

function serverBlock(s) {
  const st = state(s);
  const slots = s.maxListeners > 0 ? `${s.listeners}/${s.maxListeners} listening` :
                (s.listeners ? `${s.listeners} listening` : '');
  const free = (s.freeInSec > 0) ? ` · free in ${Math.ceil(s.freeInSec / 60)} min` : '';
  const radios = (s.radios || []).map((r) => radioLine(r, s)).join('') ||
    '<div class="radio cap">This server has not published its radios yet.</div>';
  // ★ The aerial and the machine, each on its own line and each only when said. An empty label
  //   would be worse than nothing: it implies we asked and got no answer.
  const extra =
    (s.antenna ? `<div class="radio cap">Antenna: ${esc(s.antenna)}</div>` : '') +
    (s.host ? `<div class="radio cap">Server: ${esc(s.host)}</div>` : '');
  return `<details class="srv${s.unreachable ? ' down' : ''}">
    <summary>
      <i class="dot ${st.cls}" title="${esc(st.label)}"></i>
      <span>${esc(s.name)}</span>
      ${s.kind === 'tunnel' ? '<span class="tag">tunnel</span>' : ''}
      <span class="meta">${esc(s.grid)}${s.unreachable ? ' · not responding'
                          : (slots ? ' · ' + esc(slots) : '') + esc(free)}</span>
    </summary>
    <div class="body">
      ${radios}${extra}
      <a class="listen" href="${esc(listenUrl(s))}" target="_blank" rel="noopener noreferrer">Listen</a>
    </div>
  </details>`;
}

function render(servers) {
  document.getElementById('count').textContent =
    servers.length ? `${servers.length} server${servers.length === 1 ? '' : 's'} online` : '';

  const list = document.getElementById('list');
  if (!servers.length) {
    list.innerHTML = `<div class="empty">
      <p>No servers are listed yet.</p>
      <p>Running VibeServer? Turn on <code>List on VibeSDR.net</code> in the app
         and yours will appear here.</p></div>`;
    return;
  }

  // ★ Grouped by country and COLLAPSED, the way the app sorts UberSDR and KiwiSDR — so the site
  //   and the picker present the same shape.
  const byCountry = new Map();
  for (const s of servers) {
    const cc = s.country || '';
    if (!byCountry.has(cc)) byCountry.set(cc, []);
    byCountry.get(cc).push(s);
  }
  const groups = [...byCountry.entries()]
    .sort((a, b) => countryName(a[0]).localeCompare(countryName(b[0])));

  list.innerHTML = groups.map(([cc, rows], i) => `
    <details class="country" ${groups.length <= 2 || i === 0 ? 'open' : ''}>
      <summary>${flag(cc)} ${esc(countryName(cc))}
        <span class="n">${rows.length}</span><span class="chev">›</span></summary>
      ${rows.map(serverBlock).join('')}
    </details>`).join('');

  for (const s of servers) {
    const st = state(s);
    L.circleMarker([s.lat, s.lon], {
      radius: 7, color: st.colour, weight: 2,
      fillColor: st.colour, fillOpacity: st.cls === 'sh-busy' ? 0 : 0.85,
    }).addTo(map).bindPopup(
      `<b>${esc(s.name)}</b><br>${esc(s.grid)} · ${esc(st.label)}<br>` +
      `<a href="${esc(listenUrl(s))}" target="_blank" rel="noopener noreferrer">Listen</a>`
    );
  }
}

/**
 * ★★★ THE PING IS LIVENESS, NOT TELEMETRY. A server renews its listing every 15 minutes, so the
 *     listener count in the directory record is up to 15 minutes old — it showed "0/10 listening"
 *     while somebody was plainly listening (Stuart, 2026-08-22). Pinging often enough to be live
 *     would spend the whole D1 write budget on a number that decides nothing.
 * ★★ A TUNNELLED SERVER IS REAL HTTPS, so this page can simply ASK it — the thing a plain-HTTP
 *    port-forwarded receiver can never allow from an https page, and the quiet bonus of putting
 *    everyone behind a tunnel.
 * ★ Best effort and per server: one that is asleep, restarting or slow just keeps the directory's
 *   own figure rather than blanking the row or holding up the page.
 */
async function withLiveCounts(servers) {
  await Promise.all(servers.map(async (s) => {
    if (!s.address) return;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 4000);
      const r = await fetch(`https://${s.address}/vibeserver.json`,
                            { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) return;
      const j = await r.json();
      if (Number.isFinite(j.listeners)) s.listeners = Number(j.listeners);
      if (Number.isFinite(j.maxUsers)) s.maxListeners = Number(j.maxUsers);
      if (Number.isFinite(j.freeInSec)) s.freeInSec = Number(j.freeInSec);
      s.live = true;
    } catch {
      // ★★★ A SERVER THAT DOES NOT ANSWER MUST NOT LOOK HEALTHY. This used to keep the
      //     directory's own figures, so a receiver whose tunnel had died went on showing
      //     "2/10 listening" for the half hour until its listing expired — the listing is
      //     LIVENESS, and it is up to fifteen minutes stale by design.
      // ★★ The directory decides who is LISTED; the page decides what is REACHABLE. Saying so is
      //    the whole difference between a stale entry and a lie.
      s.unreachable = true;
    }
  }));
  return servers;
}

fetch('/api/directory')
  .then((r) => r.json())
  .then((d) => withLiveCounts(Array.isArray(d.servers) ? d.servers : []))
  .then((servers) => render(servers))
  .catch(() => {
    document.getElementById('list').innerHTML =
      '<div class="empty">The directory could not be reached. Try again shortly.</div>';
  });
</script>
</body>
</html>
