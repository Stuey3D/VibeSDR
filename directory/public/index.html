<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeServer Directory — VibeSDR</title>
<meta name="description" content="Public VibeServer receivers you can listen to right now.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    /* ★★★ THE WEB CLIENT'S PALETTE, TO THE VALUE. Stuart wanted the directory to look like the
       thing it advertises — the phosphor terminal of the VibeServer landing page, not a generic
       dark site wearing an amber link colour (2026-08-22: "i thought more along these lines").
       These are web/client/index.html's own tokens; copied by value because this page ships alone
       on a Worker and cannot import them, so if the brand moves, it moves here too. */
    --bg: #080601; --panel: #0d0a02; --line: rgba(255,176,0,.22);
    --text: #ffcc88; --dim: rgba(255,160,0,.5); --accent: #ffb833;
    /* ★★ GREEN IS THE OTHER HALF OF THE BRAND, not just the "free" swatch — amber and phosphor
       green are VibeSDR's two primary colours (Stuart, 2026-08-22). So the page divides the work
       between them rather than being amber with one green dot: AMBER is identity and action —
       headings, names, the Listen button — and GREEN is life, everything that says this receiver
       is up and has room for you. */
    --free: #35E08A; --phosphor: #35E08A; --busy: #e05050;
    /* ★★ THE TEMPORARY SHARE GIVES UP AMBER AND TAKES BLUE. On a page that is amber throughout, a
       STATE wearing amber cannot be picked out from the furniture — and this marker's whole job is
       to be spotted on a map (Stuart: "just change the colour of the diamond to blue or
       something"). It keeps its diamond, so the shape carries the meaning for anyone who cannot
       separate the two colours. */
    --temp: #4fc3f7;
  }
  * { box-sizing: border-box; }
  /* ★ MONOSPACE EVERYWHERE, not only in the receiver cards. Half a page in a UI sans and half in
     a terminal font reads as two pages stapled together — which is what this was. */
  /* ★★ MONOSPACE EVERYWHERE, not only in the receiver cards. Half a page in a UI sans and half in
     a terminal font reads as two pages stapled together — which is what this was.
     ★ The `font` SHORTHAND had to go, not just change: it was set after font-family and silently
       reset it, so the first attempt at this looked exactly as before. */
  body { margin: 0; background: var(--bg); color: var(--text);
         font-size: 15px; line-height: 1.5;
         font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  /* ★★ THE MASTHEAD IS THE SPLASH'S, centred and tracked wide with the same amber glow. It is the
     first thing that says which product this is, and it was saying "generic dark website". */
  header { padding: 26px 20px 18px; border-bottom: 1px solid var(--line); text-align: center; }
  /* ★★★ text-indent MATCHES letter-spacing ON EVERY CENTRED LINE. Tracking adds a trailing space
     after the LAST letter too, so a centred line sits half a space to the left without it — the
     web client learnt this the same way. */
  h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 6px; text-indent: 6px;
       color: var(--accent); text-shadow: 0 0 24px rgba(255,170,0,.35); }
  /* ★ One colour in the title now: the two-tone name belonged to the old palette, and on an amber
     page it read as one word in two shades of the same colour for no reason. */
  h1 span { color: inherit; }
  .sub { color: var(--accent); opacity: .85; font-size: 12px; letter-spacing: 3px;
         text-indent: 3px; margin-top: 6px; }
  .blurb { color: var(--dim); font-size: 12.5px; margin: 10px auto 0; max-width: 620px;
           line-height: 1.6; }
  #map { height: 46vh; min-height: 300px; background: var(--panel);
         border-bottom: 1px solid var(--line); }
  /* ★ Leaflet paints its own controls and popups in its default light theme — on this page they
     arrived as two white boxes over a black map. */
  .leaflet-control-zoom a { background: var(--panel) !important; color: var(--accent) !important;
                            border-color: var(--line) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .leaflet-popup-content { font-size: 12px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--dim); }
  main { padding: 16px 20px 60px; max-width: 900px; margin: 0 auto; }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--dim);
            font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
            padding: 10px 20px; border-bottom: 1px solid var(--line); }
  /* ★★★ THE SHAPES CARRY THEIR OWN BOX. display:inline-block lived HERE, on `.legend i`, so the
     .sh-* classes were only ever shapes by borrowing it — and the map's marker, a bare <i>, was
     an inline element whose width and height did nothing at all: no mark on the map (Stuart,
     2026-08-22). A class that draws a shape must not depend on where it is used. */
  .sh-free, .sh-busy, .sh-temp, .sh-down { display: inline-block; box-sizing: border-box; }
  .legend i { width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
  /* ★ SHAPE AS WELL AS COLOUR. Red/green is the commonest form of colour blindness and this
     legend is entirely red/green/yellow, so the shape carries the same information. */
  .sh-free { background: var(--free); border-radius: 50%; }
  .sh-busy { background: transparent; border: 2px solid var(--busy); border-radius: 50%; }
  .sh-temp { background: var(--temp); transform: rotate(45deg); }
  /* ★ Hollow and grey, and a different SHAPE again — a server that is not answering reads as
     absent rather than as another flavour of busy. */
  .sh-down { background: transparent; border: 2px solid #6b7785; }
  /* ★★★ THE MAP WEARS THE SAME SHAPES. It drew a circleMarker for every state, so a temporary
     share was a DIAMOND in the legend, a DIAMOND in the list and a CIRCLE on the map — the one
     place the shape has to do real work, because a pin has no label beside it (Stuart,
     2026-08-22: "it is a circle not a diamond on the map"). Sharing the .sh-* classes means the
     shape is defined ONCE: a new state cannot be added to the legend and forgotten here. */
  .mk { width: 13px; height: 13px; box-shadow: 0 0 0 1.5px rgba(0,0,0,.55); }
  /* ★ Leaflet's own icon class carries a white background in some builds — ours must not. */
  .mkWrap { background: none; border: 0; }
  .srv.down > summary { opacity: 0.55; }

  .country { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px;
             background: var(--panel); overflow: hidden; }
  /* ★ The country is a heading in the terminal's voice — tracked, not bolded. A monospace face
     has little weight range, so bold reads as noise where tracking reads as hierarchy. */
  .country > summary { cursor: pointer; padding: 12px 14px; font-weight: 600;
                       color: var(--accent); letter-spacing: .08em;
                       display: flex; align-items: center; gap: 10px; list-style: none; }
  .country > summary::-webkit-details-marker { display: none; }
  .country > summary .n { color: var(--dim); font-weight: 400; font-size: 13px; }
  .chev { margin-left: auto; color: var(--dim); transition: transform .15s; }
  details[open] > summary .chev { transform: rotate(90deg); }

  .srv { border-top: 1px solid var(--line); }
  .srv > summary { cursor: pointer; padding: 11px 14px 11px 18px; display: flex;
                   align-items: center; gap: 10px; list-style: none; }
  .srv > summary::-webkit-details-marker { display: none; }
  .dot { width: 10px; height: 10px; flex: 0 0 auto; }
  .srv .meta { color: var(--dim); font-size: 11px; letter-spacing: .08em;
                margin-left: auto; text-align: right; }
  /* ★ The server's name carries the amber; the grid square beside it stays dim, so the eye lands
     on the thing you choose rather than on the coordinates. */
  .srv > summary > span:not(.meta):not(.tag) { color: var(--text); letter-spacing: .04em; }
  .body { padding: 4px 14px 14px 42px; }
  .radio { border-top: 1px dashed var(--line); padding: 9px 0; font-size: 13px; }
  .radio b { font-weight: 600; }
  .radio .cap { color: var(--dim); }

  /* ★★★ THE RECEIVER'S OWN CARD, NOT A LIST ROW. Stuart, 2026-08-22, of the landing page: "this is
     so much neater and tidier" — and it is the same information, so it should not arrive in a
     different visual language depending on which page you met it on. Monospace, an amber rule, the
     name large on the left and the state opposite it. */
  .rcard {
    border: 1px solid rgba(255,176,0,.35); border-radius: 8px;
    padding: 10px 12px; margin: 10px 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .rcTop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  /* ★ Large, because it is the thing you are choosing between. */
  .rcName { font-size: 17px; font-weight: 600; color: #ffb833; letter-spacing: .04em; }
  /* ★ "2 OF 10 LISTENING" is the liveliest fact on the card — it is the page's proof that
     something is actually running at the other end, so it takes the green. */
  .rcState { font-size: 11px; color: var(--phosphor); letter-spacing: .06em;
             white-space: nowrap; flex: 0 0 auto; }
  .rcSub { margin-top: 3px; font-size: 12px; color: var(--dim); letter-spacing: .03em;
           line-height: 1.5; }
  /* ★ Brighter than the detail around it: an instruction, not another readout. */
  .rcAsk { margin-top: 4px; font-size: 12px; color: var(--accent); letter-spacing: .06em; }
  .rcHost { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 12px; color: var(--dim); letter-spacing: .03em; margin: 2px 0 10px; }
  /* ★ Brighter than the detail around it: it is an instruction, not another readout. */
  .radio .cap.ask { color: var(--accent); letter-spacing: 0.06em; margin-top: 3px; }
  /* ★★ THE ONE FILLED THING ON THE PAGE. Everything else here is an outline on near-black, which
     is what the landing page does — so the single solid amber block is unmistakably the action. */
  .listen { display: inline-block; margin-top: 10px; padding: 7px 16px; border-radius: 7px;
            background: var(--accent); color: #120a00; text-decoration: none; font-weight: 600;
            font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
            font-family: inherit; }
  .listen:hover { background: #ffc75c; }
  /* ★ Green says "room for you"; a full or silent receiver must not borrow it. */
  .rcState.full { color: var(--busy); }
  .rcState.down { color: var(--dim); }
  /* ★ The estate's headcount is the same kind of fact — how much is alive right now. */
  #count { color: var(--phosphor); letter-spacing: .1em; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line);
         letter-spacing: .04em;
         color: var(--dim); }
  /* ★ A PIN is a fact about ACCESS, not a fault — amber, not red. */
  .tag.lock { color: var(--accent); border-color: var(--accent); }
  /* ★ The same blue as the diamond on the map and in the legend: one colour means one thing. */
  .tag.temp { color: var(--temp); border-color: var(--temp); }
  .empty { color: var(--dim); text-align: center; padding: 40px 20px; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
  .filters { padding: 10px 20px; border-bottom: 1px solid var(--line);
             display: flex; flex-direction: column; gap: 8px; }
  .fRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fRow label { color: var(--dim); font-size: 11px; letter-spacing: .1em;
                text-transform: uppercase; }
  /* ★ A chip is a button, and must look pressable and read as pressed — the whole control is
     useless if you cannot see which bands are on. */
  .chip { font-size: 12px; padding: 4px 11px; border-radius: 20px; cursor: pointer;
          letter-spacing: .04em; font-family: inherit;
          border: 1px solid var(--line); background: none; color: var(--text); }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent);
                               background: rgba(255,184,51,.12); }
  .chip .n { color: var(--dim); margin-left: 6px; }
  .chip[aria-pressed="true"] .n { color: inherit; }
  #freq { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
          color: var(--accent); padding: 5px 9px; font-size: 13px; width: 190px;
          font-family: inherit; letter-spacing: .04em; }
  #freq:focus { outline: none; border-color: var(--accent); }
  .fNote { color: var(--dim); font-size: 12px; }
  .fClear { font-size: 11px; background: none; border: 1px solid var(--line);
            color: var(--dim); border-radius: 6px; padding: 4px 10px; cursor: pointer;
            font-family: inherit; letter-spacing: .1em; text-transform: uppercase; }
  .fClear:hover { color: var(--text); border-color: var(--accent); }
  a { color: var(--accent); }
  footer { color: var(--dim); font-size: 11px; text-align: center; padding: 0 20px 30px;
           letter-spacing: .06em; }
</style>
</head>
<body>

<header>
  <!-- ★★ THE SPLASH'S OWN SHAPE: the name large and tracked, a small tracked label beneath it,
       then the sentence. Mirrors "VIBESDR / VIBESERVER · WEB CLIENT" so somebody who has seen one
       recognises the other. -->
  <h1>VIBESERVER</h1>
  <div class="sub">PUBLIC RECEIVER DIRECTORY</div>
  <div class="blurb">Receivers you can listen to right now. Anyone running VibeServer can list
    theirs from the app — see <a href="https://vibesdr.net">vibesdr.net</a>.</div>
</header>

<div class="legend">
  <span><i class="sh-free"></i>Free slot</span>
  <span><i class="sh-busy"></i>No slots</span>
<!-- ★ Back in the legend now that a share can declare itself — see untilText(). It was removed
       while nothing could produce the state, which is the only reason a key entry should exist. -->
  <span><i class="sh-temp"></i>Temporary share</span>
  <span style="margin-left:auto" id="count"></span>
</div>

<!-- ★★ FILTERS ABOVE THE MAP, because they filter the map too. A control that changes what the
        pins show, placed below them, gets found after the visitor has already decided the
        directory is small. -->
<div class="filters" id="filters" hidden>
  <div class="fRow" id="bandChips"></div>
  <div class="fRow">
    <!-- ★ The label carries the hint, not the placeholder. A placeholder listing three examples was
         wider than any sensible box and arrived CLIPPED mid-word — an example nobody can read is
         worse than none, and it vanishes the moment you type anyway. -->
    <label for="freq">Can hear</label>
    <input id="freq" type="text" inputmode="decimal" autocomplete="off"
           placeholder="99.9 MHz">
    <span class="fNote" id="freqNote">MHz unless you say kHz</span>
    <button class="fClear" id="clear" hidden>Clear</button>
  </div>
  <div class="fNote" id="filterSummary"></div>
</div>

<div id="map"></div>

<main>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<footer>
  Positions are the operator's Maidenhead square — a grid square, not an address.
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@joergdietrich/leaflet.terminator@1.1.0/L.Terminator.js"></script>
<script>
// ★★★ THE GREYLINE IS NOT DECORATION FOR THIS AUDIENCE — IT IS INFORMATION. A DXer can see which
//     receivers are sitting in enhanced propagation right now, which is a reason to click one
//     rather than a background texture.

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** ★ A two-letter country code to its flag, via regional indicator symbols. No image assets. */
function flag(cc) {
  if (!/^[A-Z]{2}$/.test(cc || '')) return '🌐';
  return String.fromCodePoint(...[...cc].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
}

let countryNames = null;
try { countryNames = new Intl.DisplayNames(['en-GB'], { type: 'region' }); } catch { /* older browser */ }
const countryName = (cc) => {
  if (!/^[A-Z]{2}$/.test(cc || '')) return 'Elsewhere';
  try { return countryNames ? countryNames.of(cc) : cc; } catch { return cc; }
};

/** Free / busy / temporary — the three states the legend names. */
function state(s) {
  // ★ Checked first: an unreachable server is not free, not busy and not a temporary share — it
  //   is simply not answering, and that is what a listener needs to know before clicking.
  if (s.unreachable) {
    return { cls: 'sh-down', colour: '#6b7785', label: 'not responding' };
  }
  // ★★★ THE SERVER SAYS SO — never inferred from the ping interval. It WAS, and so every ordinary
  //     listing came out a "temporary share": the default TTL is thirty minutes, well inside the
  //     window this used to guess with. A product concept must not be invented out of a timing
  //     value. A temporary share is a different KIND of entry, not a level of busy, so it still
  //     wins the shape.
  const temporary = !!s.temporary;
  const full = s.maxListeners > 0 && s.listeners >= s.maxListeners;
  if (full) return { cls: 'sh-busy', colour: getComputedStyle(document.documentElement).getPropertyValue('--busy').trim(), label: 'no free slot' };
  if (temporary) return { cls: 'sh-temp', colour: getComputedStyle(document.documentElement).getPropertyValue('--temp').trim(), label: 'temporary share' };
  return { cls: 'sh-free', colour: getComputedStyle(document.documentElement).getPropertyValue('--free').trim(), label: 'free slot' };
}

const map = L.map('map', { worldCopyJump: true, scrollWheelZoom: true }).setView([30, 0], 2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 12,
}).addTo(map);

// The day/night shadow, refreshed so it stays honest on a page left open.
let term = null;
try {
  term = L.terminator({ fillOpacity: 0.28, color: '#000', weight: 0 });
  term.addTo(map);
  setInterval(() => { try { term.setTime(new Date()); } catch {} }, 60000);
} catch { /* terminator plugin unavailable — the map is still useful */ }

/**
 * ★★★ ALWAYS SEND A LISTENER TO THE STABLE ADDRESS, NEVER THE TUNNEL.
 *
 * The tunnel hostname rotates on every restart and a browser keys localStorage by ORIGIN, so a
 * listener who arrives on the raw tunnel URL loses every view setting the moment the server comes
 * back. The stable address serves the same page and tells it where the receiver is, so the
 * settings survive. Linking straight to s.url quietly threw that away for everyone who came
 * through this page rather than a shared link (Stuart, 2026-08-22).
 * ★ Falls back to the published URL for an entry with no address — a directly reachable server
 *   that never needed a tunnel.
 */
function listenUrl(s) {
  return s.address ? `https://${s.address}/` : s.url;
}

/**
 * One radio, as a listener would ask about it: what it is, what it can hear, whether there is room,
 * and how long they get. Stuart's own entry, 2026-08-22:
 *   RTL-SDR v4 · FM broadcast · 0/10 slots · 30 minute limit
 * ★ Anything the server did not say is simply omitted — never guessed, never "unknown".
 */
/**
 * One radio, in the SAME WORDS the server's own landing page uses. A listener who reaches a
 * receiver from here should recognise what they were promised — a second vocabulary for the same
 * facts is how "shared" ends up meaning two different things (Stuart, 2026-08-22: it should read
 * "like the Airspy is now FM Broadcast, shared VFO etc").
 */
function radioLine(r, s) {
  /* ══ MIRROR OF THE RECEIVER'S OWN LANDING PAGE ═══════════════════════════════════════════════
   * ★★★ THE SAME FIELDS, READ THE SAME WAY. This page had its own, simpler idea of a radio and so
   *     described the same receiver differently from the page it links to: "wfm · one listener at
   *     a time" here against "500 kHz – 1766 MHz · UNRESTRICTED · one listener at a time" there,
   *     and once the server started publishing the real fields it degenerated into printing an
   *     array — "500000,1766000000" (Stuart, 2026-08-23: "the directory needs to mirror the
   *     landing screen"). The logic below is web/client/src/main.ts's, deliberately.
   * ★★ TWO PUBLISHERS, ONE SHAPE. A daemon sends the front door's fields (`coverage` in Hz,
   *    `allowed`, `allowedNames`); a phone sends band NAMES in `coverage` and its tunable set in
   *    `ranges`. Both are normalised here rather than either being asked to change — an older
   *    server in the field cannot be edited, and a listing that only works for the newest build is
   *    not a directory.
   */
  const pair = (v) => Array.isArray(v) && v.length === 2
                   && Number.isFinite(+v[0]) && Number.isFinite(+v[1]);
  const nums = (v) => (Array.isArray(v) ? v : []).filter(pair).map((p) => [+p[0], +p[1]]);
  const words = (v) => (Array.isArray(v) ? v : [])
                        .filter((c) => typeof c === 'string' && c.trim()).map((c) => c.trim());

  const cov     = nums(r.coverage);                       // hardware reach, in Hz
  const allowed = nums(r.allowed).length ? nums(r.allowed) : nums(r.ranges);
  const named   = words(r.allowedNames).length ? words(r.allowedNames) : words(r.coverage);
  const restricted = !!r.restricted;

  // ★ A LOCKED RADIO IS ITS WINDOW and needs no qualifier: "1 kHz – 2000 MHz, restrictions in
  //   place" about a receiver fixed to 2.8–10.8 MHz is true and useless. State the window.
  const centre = Number(r.centreHz) || 0, span = Number(r.spanHz) || 0;
  const lo = (r.locked && centre > 0 && span > 0) ? centre - span / 2 : 0;
  const hi = (r.locked && centre > 0 && span > 0) ? centre + span / 2 : 0;

  const mhz   = (h) => `${(h / 1e6).toFixed(3).replace(/0+$/, '').replace(/\.$/, '')}`;
  const hzTxt = (h) => h >= 1e6 ? `${mhz(h)} MHz` : `${Math.round(h / 1e3)} kHz`;

  let range;
  if (lo > 0 && hi > lo)             range = `${mhz(lo)} – ${mhz(hi)} MHz`;
  else if (restricted && named.length)   range = named.join(', ');
  else if (restricted && allowed.length) range = allowed.map(([a, b]) => `${hzTxt(a)} – ${hzTxt(b)}`).join(', ');
  else if (cov.length)                   range = cov.map(([a, b]) => `${hzTxt(a)} – ${hzTxt(b)}`).join(', ')
                                                + (restricted ? ' · RESTRICTIONS IN PLACE' : ' · UNRESTRICTED');
  // ★ A phone publishes names without the hardware numbers — say the words rather than nothing.
  else if (named.length)                 range = named.join(', ');
  else if (allowed.length)               range = allowed.map(([a, b]) => `${hzTxt(a)} – ${hzTxt(b)}`).join(', ');
  else if (centre > 0)                   range = `${mhz(centre)} MHz`;
  else                                   range = esc(r.mode || '');

  // ★★★ THE CAP IS THE RADIO'S, NOT THE MACHINE'S. Every row read the SERVER's maxListeners, so a
  //     front door holding three ten-listener receivers advertised "0 OF 1 LISTENING" three times
  //     — three full-looking radios on a machine with room for thirty.
  const max = Number(r.maxListeners) || (s && s.maxListeners) || 0;
  // ★ ONE TEST, TWO USES — the wording and the etiquette line are the same fact.
  const sharedDial = max > 1 && !r.locked;
  const kind = max <= 1 ? 'one listener at a time'
             : r.locked ? 'individual VFOs · locked RF centre'
                        : 'shared VFO · unlocked RF centre';

  const bits = [esc(range), esc(kind)];
  if (restricted && !(lo > 0) && !named.length) bits.push('restricted range');
  if (s && s.limitMin > 0) bits.push(`${s.limitMin} minute limit`);

  // ★★★ OCCUPANCY IS SAID OR IT IS NOT SHOWN. This filled a missing count with ZERO, so the
  //     directory announced FREE about a receiver whose own landing page read "FULL · FREE IN
  //     25:46" (Stuart, 2026-08-23: "the website lies about occupancy"). A wrong FREE is worse
  //     than a blank: it sends somebody to a radio that will refuse them, and it is the same
  //     mistake as a client deciding what only the server knows.
  //  ★★ A single-radio server IS its radio, so the machine's own figures are that radio's — the
  //     one case where borrowing them states a fact rather than assuming one.
  const solo = !!(s && Array.isArray(s.radios) && s.radios.length === 1);
  const said = Number.isFinite(Number(r.listeners)) ? Number(r.listeners)
             : solo && Number.isFinite(Number(s.listeners)) ? Number(s.listeners) : null;
  const freeIn = Number.isFinite(Number(r.freeInSec)) ? Number(r.freeInSec)
               : solo ? Number(s.freeInSec) : -1;
  const isFull = said !== null && max > 0 && said >= max;
  // ★ ONE LISTENER AT A TIME READS "FREE", not "0 of 1" — the landing page's own wording.
  const stateTxt = s && s.unreachable ? 'NOT RESPONDING'
                 : said === null ? ''
                 : isFull ? (freeIn > 0 ? `FULL · FREE IN ${mmss(freeIn)}` : 'FULL')
                 : max <= 1 ? 'FREE'
                 : `${said} OF ${max} LISTENING`;

  // ★★ THE AERIAL, UNDER THE RANGE IT QUALIFIES — and PER RADIO, because one machine can hold
  //    three receivers on three different antennas. A dongle advertising 1 kHz – 1.7 GHz above
  //    "YouLoop into an LNA" tells a visitor something neither line says alone.
  const ant = String(r.antenna || (s && s.radios && s.radios.length === 1 ? s.antenna : '') || '').trim();

  const etiquette = sharedDial
    ? `<div class="rcAsk">ASK BEFORE TUNING — everyone here shares one dial</div>` : '';

  return `<div class="rcard">
      <div class="rcTop"><span class="rcName">${esc(r.name || r.driver || 'Radio')}</span>
        <span class="rcState ${isFull ? 'full' : ''}${s && s.unreachable ? ' down' : ''}"
              >${esc(stateTxt)}</span></div>
      <div class="rcSub">${bits.join(' · ')}</div>
      ${ant ? `<div class="rcSub">⚲ ${esc(ant)}</div>` : ''}
      ${etiquette}
    </div>`;
}

function shareLeft(s) {
  return s.until > 0 ? Math.max(0, s.until - Math.floor(Date.now() / 1000)) : 0;
}

function untilText(sec) {
  if (sec <= 0) return '';
  const m = Math.floor(sec / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 14) return `${Math.floor(d / 7)} weeks`;
  if (d >= 1)  return d === 1 ? '1 day' : `${d} days`;
  if (h >= 1)  return h === 1 ? '1 hour' : `${h} hours`;
  return m <= 1 ? 'a minute' : `${m} minutes`;
}

/** mm:ss, the way the receiver's own card writes a countdown. */
function mmss(sec) {
  const m = Math.floor(sec / 60), t = Math.max(0, Math.floor(sec % 60));
  return `${m}:${String(t).padStart(2, '0')}`;
}

function serverBlock(s) {
  const st = state(s);

  const radios = (s.radios || []).map((r) => radioLine(r, s)).join('') ||
    '<div class="radio cap">This server has not published its radios yet.</div>';
  // ★ The aerial and the machine, each on its own line and each only when said. An empty label
  //   would be worse than nothing: it implies we asked and got no answer.
  // ★ The aerial now belongs to the RADIO card (as on the landing page, where each radio carries
  //   its own); only the machine is left to say here, underneath.
  /**
   * ★★ THE PLATFORM AS A WORD. Real OS logos are trademarks — Apple's Finder icon and the Windows
   *    logo are not ours to redistribute, and Google's robot has brand guidelines — and glyphs
   *    render differently on every platform reading the page. A word says the same thing
   *    everywhere and needs no licence (Stuart, 2026-08-22: "just list the OS as text").
   * ★ An unknown platform shows nothing rather than a guess.
   */
  // ★ Printed as the server said it — no table to keep in step with platforms we have not met.
  const extra = (s.host || s.platform)
    ? `<div class="rcHost">${s.host ? `Server: ${esc(s.host)}` : ''}`
      + `${s.host && s.platform ? '<br>' : ''}${esc(s.platform || '')}</div>` : '';
  return `<details class="srv${s.unreachable ? ' down' : ''}" data-key="srv:${esc(s.id || s.name)}">
    <summary>
      <i class="dot ${st.cls}" title="${esc(st.label)}"></i>
      <span>${esc(s.name)}</span>
      ${s.pin ? '<span class="tag lock" title="This receiver needs a PIN — it is not open to everyone">\u{1F512} PIN</span>' : ''}
      ${s.kind === 'tunnel' ? '<span class="tag">tunnel</span>' : ''}
      ${shareLeft(s) > 0 ? `<span class="tag temp" title="This listing ends when the share does — the receiver stays running, it just stops being advertised here">Temporary share \u00b7 ${esc(untilText(shareLeft(s)))} left</span>` : ''}
      <!-- ★★ THE COUNT BELONGS TO THE RADIO, NOT THE SERVER. A machine can hold several receivers
           with different occupancy, so "2/10 listening" beside the server NAME is only ever true
           by accident — and on the receiver's own landing page it has always sat in the radio box
           (Stuart, 2026-08-22). This line says WHERE the server is; the cards say who is on what. -->
      <span class="meta">${esc(s.grid)}${s.unreachable ? ' · not responding' : ''}</span>
    </summary>
    <div class="body">
      ${radios}${extra}
      <a class="listen" href="${esc(listenUrl(s))}" target="_blank" rel="noopener noreferrer">Listen</a>
    </div>
  </details>`;
}


/* ══ FILTERING ═══════════════════════════════════════════════════════════════════════════════
 * ★★★ EVERY BAND NAME ON THIS PAGE COMES FROM A SERVER. There is no band table here and there
 *     must never be one: the servers name their bands from their OWN region-aware plan, so medium
 *     wave ends at 1606.5 kHz in Region 1 and 1705 in Region 2 and the chip says whatever the
 *     server that owns the receiver called it. A list hardcoded here would drift the moment a plan
 *     changed, and would invent bands for radios nobody has told us about.
 * ★★ The chips are therefore DERIVED from what is listed, so a band with nobody on it does not
 *    appear — the directory never offers a filter that can only return nothing.
 */
let ALL = [];                       // every listing, unfiltered — the filters never refetch
const bandsOn = new Set();
let freqHz = 0;

/** Bands a server can offer, as words, across all its radios. */
function bandsOf(s) {
  const out = new Set();
  for (const r of (s.radios || []))
    for (const c of (Array.isArray(r.coverage) ? r.coverage : []))
      if (typeof c === 'string' && c.trim()) out.add(c.trim());
  return out;
}

/** ★ Ranges as published, defended against a server sending nonsense: this is the one place the
 *    page does arithmetic on something another machine said. */
function rangesOf(s) {
  const out = [];
  for (const r of (s.radios || []))
    for (const p of (Array.isArray(r.ranges) ? r.ranges : [])) {
      const lo = Number(Array.isArray(p) ? p[0] : NaN), hi = Number(Array.isArray(p) ? p[1] : NaN);
      if (Number.isFinite(lo) && Number.isFinite(hi) && hi > lo) out.push([lo, hi]);
    }
  return out;
}

/**
 * ★★★ A BARE NUMBER IS AMBIGUOUS, SO THE PAGE SAYS WHAT IT DECIDED. "1467" is medium wave in kHz
 *     to one person and 1467 MHz to another, and silently picking one produces a search that
 *     returns the wrong servers and looks broken. MHz is the radio convention for a bare figure,
 *     so that is the assumption — and the interpretation is ECHOED back ("searching 1.467 MHz"),
 *     which turns a wrong guess into something the visitor can see and correct rather than a
 *     mystery.
 * ★ A unit, when given, always wins.
 */
function parseFreq(text) {
  const t = String(text || '').trim().toLowerCase().replace(/,/g, '');
  if (!t) return 0;
  const m = t.match(/^([0-9]*\.?[0-9]+)\s*(ghz|mhz|khz|hz|g|m|k)?$/);
  if (!m) return NaN;                                   // not a frequency — say so, do not ignore
  const n = parseFloat(m[1]);
  if (!Number.isFinite(n) || n <= 0) return NaN;
  const mult = { ghz: 1e9, g: 1e9, mhz: 1e6, m: 1e6, khz: 1e3, k: 1e3, hz: 1 }[m[2] || 'mhz'];
  return n * mult;
}

function prettyHz(hz) {
  if (hz >= 1e9) return `${(hz / 1e9).toFixed(3).replace(/\.?0+$/, '')} GHz`;
  if (hz >= 1e6) return `${(hz / 1e6).toFixed(3).replace(/\.?0+$/, '')} MHz`;
  if (hz >= 1e3) return `${(hz / 1e3).toFixed(3).replace(/\.?0+$/, '')} kHz`;
  return `${Math.round(hz)} Hz`;
}

/** ★ Bands are OR (an FM-DXer wants FM servers), the frequency box is AND (it narrows further). */
function matches(s) {
  if (bandsOn.size) {
    const have = bandsOf(s);
    let hit = false;
    for (const b of bandsOn) if (have.has(b)) { hit = true; break; }
    if (!hit) return false;
  }
  if (freqHz > 0) {
    const rs = rangesOf(s);
    if (!rs.length) return false;      // ★ cannot say ⇒ cannot match. Counted and reported below.
    if (!rs.some(([lo, hi]) => freqHz >= lo && freqHz <= hi)) return false;
  }
  return true;
}

function renderChips() {
  const counts = new Map();
  for (const s of ALL) for (const b of bandsOf(s)) counts.set(b, (counts.get(b) || 0) + 1);
  const box = document.getElementById('bandChips');
  // ★ Commonest first, then alphabetical — a stable order that needs no knowledge of where a band
  //   sits in the spectrum, which is knowledge this page deliberately does not have.
  const bands = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  box.innerHTML = bands.map(([b, n]) =>
    `<button class="chip" type="button" aria-pressed="${bandsOn.has(b)}" data-band="${esc(b)}">
       ${esc(b)}<span class="n">${n}</span></button>`).join('');
  for (const el of box.querySelectorAll('.chip')) {
    el.addEventListener('click', () => {
      const b = el.dataset.band;
      if (bandsOn.has(b)) bandsOn.delete(b); else bandsOn.add(b);
      renderChips(); applyFilters();
    });
  }
  // ★ Hidden entirely when there is nothing to choose between — one band and one server is a
  //   control that can only ever be a no-op.
  document.getElementById('filters').hidden = ALL.length < 2 && bands.length < 2;
}

function applyFilters() {
  const shown = ALL.filter(matches);
  const active = bandsOn.size > 0 || freqHz > 0;
  document.getElementById('clear').hidden = !active;

  const sum = document.getElementById('filterSummary');
  if (!active) sum.textContent = '';
  else {
    // ★★ A SERVER THAT NEVER PUBLISHED A RANGE IS NOT A SERVER THAT CANNOT HEAR YOU. Older
    //    servers say nothing about what they can tune, and silently dropping them would make the
    //    directory look smaller than it is — so they are counted and named, not hidden.
    const mute = freqHz > 0 ? ALL.filter((s) => !rangesOf(s).length).length : 0;
    sum.textContent = `Showing ${shown.length} of ${ALL.length} servers.`
      + (mute ? ` ${mute} ${mute === 1 ? 'has' : 'have'} not published a tuning range and cannot`
                + ` be matched by frequency.` : '');
  }
  render(shown, active);
}

document.getElementById('freq').addEventListener('input', (e) => {
  const hz = parseFreq(e.target.value);
  const note = document.getElementById('freqNote');
  if (Number.isNaN(hz)) { note.textContent = 'not a frequency'; freqHz = 0; }
  else if (hz > 0) { note.textContent = `searching ${prettyHz(hz)}`; freqHz = hz; }
  else { note.textContent = 'MHz unless you say kHz'; freqHz = 0; }
  applyFilters();
});

document.getElementById('clear').addEventListener('click', () => {
  bandsOn.clear(); freqHz = 0;
  document.getElementById('freq').value = '';
  document.getElementById('freqNote').textContent = '';
  renderChips(); applyFilters();
});

/** ★ Markers live in a layer of their own so a re-render REPLACES them. Adding straight to the
 *    map, as this did, leaves every previous pin behind — a filter would have made the map grow
 *    rather than narrow. */
const markers = L.layerGroup().addTo(map);

function render(servers, filtered) {
  // ★ The header counts the ESTATE, not the filtered view — how many servers exist does not
  //   change because somebody typed a frequency. The filtered figure is in the summary line.
  const n = ALL.length || servers.length;
  document.getElementById('count').textContent =
    n ? `${n} server${n === 1 ? '' : 's'} online` : '';

  markers.clearLayers();
  const list = document.getElementById('list');
  // ★★★ A REFRESH MUST NOT SHUT WHAT THE READER OPENED. The page reloads itself every minute so
  //     an expired share leaves the screen — but rebuilding the list collapses every <details>,
  //     so a card somebody was reading would snap shut under them on a timer. The open keys are
  //     captured and restored, which also keeps the country groups where the visitor put them.
  const openKeys = new Set(
    [...document.querySelectorAll('#list details[open]')].map((d) => d.dataset.key));
  if (!servers.length) {
    list.innerHTML = filtered
      ? `<div class="empty">
           <p>No listed server matches that.</p>
           <p>Try a different band, or clear the filter to see everything.</p></div>`
      : `<div class="empty">
           <p>No servers are listed yet.</p>
           <p>Running VibeServer? Turn on <code>List on VibeSDR.net</code> in the app
              and yours will appear here.</p></div>`;
    return;
  }

  // ★ Grouped by country and COLLAPSED, the way the app sorts UberSDR and KiwiSDR — so the site
  //   and the picker present the same shape.
  const byCountry = new Map();
  for (const s of servers) {
    const cc = s.country || '';
    if (!byCountry.has(cc)) byCountry.set(cc, []);
    byCountry.get(cc).push(s);
  }
  const groups = [...byCountry.entries()]
    .sort((a, b) => countryName(a[0]).localeCompare(countryName(b[0])));

  list.innerHTML = groups.map(([cc, rows], i) => `
    <details class="country" data-key="cc:${esc(cc)}" ${
      openKeys.size ? (openKeys.has(`cc:${cc}`) ? 'open' : '')
                    : (groups.length <= 2 || i === 0 ? 'open' : '')}>
      <summary>${flag(cc)} ${esc(countryName(cc))}
        <span class="n">${rows.length}</span><span class="chev">›</span></summary>
      ${rows.map(serverBlock).join('')}
    </details>`).join('');

  for (const d of list.querySelectorAll('details.srv'))
    if (openKeys.has(d.dataset.key)) d.open = true;

  for (const s of servers) {
    const st = state(s);
    // ★ A divIcon rather than a circleMarker precisely so the CSS above decides the shape —
    //   the legend, the list and the map cannot drift apart.
    L.marker([s.lat, s.lon], {
      title: `${s.name} \u2014 ${st.label}`,
      icon: L.divIcon({
        className: 'mkWrap', iconSize: [13, 13], iconAnchor: [7, 7], popupAnchor: [0, -7],
        html: `<i class="mk ${st.cls}" title="${esc(st.label)}"></i>`,
      }),
    }).addTo(markers).bindPopup(
      `<b>${esc(s.name)}</b>${s.pin ? ' \u{1F512}' : ''}<br>${esc(s.grid)} · ${esc(st.label)}<br>` +
      `<a href="${esc(listenUrl(s))}" target="_blank" rel="noopener noreferrer">Listen</a>`
    );
  }
}

/**
 * ★★★ THE PING IS LIVENESS, NOT TELEMETRY. A server renews its listing every 15 minutes, so the
 *     listener count in the directory record is up to 15 minutes old — it showed "0/10 listening"
 *     while somebody was plainly listening (Stuart, 2026-08-22). Pinging often enough to be live
 *     would spend the whole D1 write budget on a number that decides nothing.
 * ★★ A TUNNELLED SERVER IS REAL HTTPS, so this page can simply ASK it — the thing a plain-HTTP
 *    port-forwarded receiver can never allow from an https page, and the quiet bonus of putting
 *    everyone behind a tunnel.
 * ★ Best effort and per server: one that is asleep, restarting or slow just keeps the directory's
 *   own figure rather than blanking the row or holding up the page.
 */
async function withLiveCounts(servers) {
  await Promise.all(servers.map(async (s) => {
    if (!s.address) return;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 4000);
      const r = await fetch(`https://${s.address}/vibeserver.json`,
                            { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) return;
      const j = await r.json();
      if (Number.isFinite(j.listeners)) s.listeners = Number(j.listeners);
      if (Number.isFinite(j.maxUsers)) s.maxListeners = Number(j.maxUsers);
      if (Number.isFinite(j.freeInSec)) s.freeInSec = Number(j.freeInSec);
      s.live = true;

      // ★★★ AND EACH RADIO SEPARATELY ON A MULTI-RADIO SERVER, because the answer above is the
      //     MACHINE's and says nothing about which receiver is busy. The listing's per-radio
      //     counts come from the ping and are up to fifteen minutes old, so a radio someone had
      //     just left went on reading FULL — and a stale FULL is the bad direction: it turns
      //     people away from a receiver that is free, where a stale FREE costs only a wasted
      //     click (Stuart, 2026-08-23: "I closed the tab from the Pi and its still saying full").
      //  ★★ BOUNDED ON PURPOSE. One request per radio, only where there is more than one radio —
      //     a single-radio server IS its machine, so the answer above already covers it — and
      //     only for the first few, so a directory of two hundred servers cannot turn one refresh
      //     into a flood. What is not refreshed keeps the listing's figure, which is what it did
      //     before.
      //  ★ /r/<id>/vibeserver.json is the route the receiver's own landing page uses, so it is
      //    proven rather than assumed — the same lesson as the loopback probe that was pointed at
      //    a port nothing listened on.
      const radios = Array.isArray(s.radios) ? s.radios : [];
      if (radios.length > 1) {
        await Promise.all(radios.slice(0, 6).map(async (rad) => {
          if (!rad || !rad.id) return;
          try {
            const c2 = new AbortController();
            const t2 = setTimeout(() => c2.abort(), 4000);
            const rr = await fetch(`https://${s.address}/r/${encodeURIComponent(rad.id)}/vibeserver.json`,
                                   { signal: c2.signal, cache: 'no-store' });
            clearTimeout(t2);
            if (!rr.ok) return;
            const rj = await rr.json();
            if (Number.isFinite(rj.listeners))  rad.listeners = Number(rj.listeners);
            if (Number.isFinite(rj.maxUsers))   rad.maxListeners = Number(rj.maxUsers);
            if (Number.isFinite(rj.freeInSec))  rad.freeInSec = Number(rj.freeInSec);
          } catch { /* ★ keep the listing's figure — one slow radio is not news about the rest */ }
        }));
      }
    } catch {
      // ★★★ A SERVER THAT DOES NOT ANSWER MUST NOT LOOK HEALTHY. This used to keep the
      //     directory's own figures, so a receiver whose tunnel had died went on showing
      //     "2/10 listening" for the half hour until its listing expired — the listing is
      //     LIVENESS, and it is up to fifteen minutes stale by design.
      // ★★ The directory decides who is LISTED; the page decides what is REACHABLE. Saying so is
      //    the whole difference between a stale entry and a lie.
      s.unreachable = true;
    }
  }));
  return servers;
}

/**
 * ★★★ THE PAGE MUST REFRESH ITSELF. It fetched ONCE, so a tab left open showed the directory as
 *     it was when it loaded — for ever. A temporary share that had ended was still on screen with
 *     a countdown frozen mid-flight, which reads as "the expiry does not work" and is
 *     indistinguishable from it (Stuart, 2026-08-22: "it was still in the directory"). The server
 *     had already dropped it; only this page had not asked.
 * ★★ A minute is well inside the smallest share anybody can set, so an ended share leaves the
 *    screen while the person watching is still watching.
 * ★ A failed refresh keeps what is on screen rather than blanking it — a blip on the visitor's
 *   line is not news about the estate. Only the FIRST load can report a failure, because only then
 *   is there nothing to show.
 */
function load(first) {
  return fetch('/api/directory')
    .then((r) => r.json())
    .then((d) => withLiveCounts(Array.isArray(d.servers) ? d.servers : []))
    .then((servers) => { ALL = servers; renderChips(); applyFilters(); })
    .catch(() => {
      if (!first) return;
      document.getElementById('list').innerHTML =
        '<div class="empty">The directory could not be reached. Try again shortly.</div>';
    });
}

load(true);
setInterval(() => load(false), 60000);
</script>
</body>
</html>
