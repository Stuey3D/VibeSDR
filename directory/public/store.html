<!doctype html>
<meta charset="utf-8">
<title>VibeSDR portable settings</title>
<!--
  ★★★ THE PORTABLE SETTINGS STORE (web/client/src/portable.ts). Loaded hidden by a server page on
  <name>.vibeserver.vibesdr.net; keeps the listener's master VIEW settings and bookmarks for this origin, so
  every server in the directory shares them. Everything stays in the listener's browser: this page makes no
  requests, and the worker never reads the cookie below (the browser does send it with GET /store).
  ★ Answers only pages on a *.vibeserver.vibesdr.net subdomain over https, and only these operations.

  ★★★ SAFARI PARTITIONS THIS FRAME'S localStorage BY THE PAGE AROUND IT — BUT NOT ITS COOKIES.
      Stuart, 2026-09-28: "Save for all" did nothing in Safari; Kiko's new server opened on defaults.
      Measured in WebKit (headless WKWebView): a value written to localStorage here from the Pi 500's page
      read back EMPTY from the Lenovo's — WebKit keys an embedded frame's localStorage by the top-level
      page. The SAME frame's cookie, written from the Pi 500, read back on the Lenovo with
      hasStorageAccess() false and no prompt: every server is on vibesdr.net, so this frame is SAME-SITE
      to them, and WebKit's cookie blocking is only for cross-site frames. The Storage Access API is not
      needed — and could not help localStorage anyway: WebKit's grant covers cookies only
      (webkit.org/blog/8124; MDN compat: no `types` parameter in Safari).
      ★ So the record lives in BOTH: localStorage (Chromium and Firefox share it; it is also each Safari
        partition's own copy) and a cookie (the one thing Safari shares). The newer wins on every read
        and is written back to the other, so a cookie Safari has expired is restored from any server
        that still holds a copy.
      ★★ Safari caps a cookie written from script at 7 days (ITP 2.1, webkit.org/blog/8613). Every read
         re-writes it, so it lasts 7 days from the last visit to ANY VibeSDR.net server, not from the save.
      ★★ The cookie goes to vibeserver.vibesdr.net with GET /store, so it is kept small: deflated when the
         browser can, split into ≤ 8 cookies of < 4 KB. A bookmark list too big for that stays out of the
         cookie (logged) rather than breaking the store's own page load.

  ★★★ THE SHARED CHUNK CACHE (web/client/src/chunkCache.ts, 2026-10-01) — the map renderer and the admin
      panel's code, fetched once for EVERY server instead of once per server (Stuart: "fetch once, store
      it in the same storage the settings and bookmarks use, so it loads once for ANY server you go to").
      ★ In IndexedDB, NOT localStorage: ~140 KB of script must never compete with the settings and
        bookmarks for localStorage's ~5 MB, nor be able to make a settings write fail on quota. A chunk
        failure of any kind is answered { ok: false } and the page fetches from its own server.
      ★★★ KEYED BY THE SHA-256 OF THE BYTES, and a put whose bytes do not hash to its key is refused
          here. That is a courtesy, not the security: ANY *.vibeserver.vibesdr.net page can talk to this
          frame, so the reading page checks the hash AGAIN against its own build before running a byte.
          This frame never decides what runs; it only keeps what it was given under the name it proved.
      ★ Bounded: ≤ 512 KB a chunk, the 2 most recently used of each name, ≤ 1.5 MB in all.
      ★ Safari partitions this frame's IndexedDB by the page around it, so there it is per server — the
        same as the HTTP cache it duplicates, and harmless.
-->
<script>
(function () {
  var KEY = 'vsPortable', CK = 'vsP', CHUNK = 3800, MAXCHUNKS = 8, AGE = 34560000;  // 400 days (Chrome's cap)
  var OK = /^https:\/\/[a-z0-9-]+\.vibeserver\.vibesdr\.net$/;
  // ★ How new a record is. The directory's reset writes only { resetAt } (and older pages no `at`).
  function stamp(v) { return v ? Math.max(Number(v.at) || 0, Number(v.resetAt) || 0, Number(v.viewAt) || 0) : 0; }
  function obj(v) { return v && typeof v === 'object' ? v : null; }
  function lsLoad() {
    try { return obj(JSON.parse(localStorage.getItem(KEY) || 'null')); }
    catch (e) { console.warn('portable store: localStorage unreadable', e); return null; }
  }
  function lsSave(v) {
    try { localStorage.setItem(KEY, JSON.stringify(v)); return true; }
    catch (e) { console.warn('portable store: localStorage write failed', e); return false; }
  }
  function cookies() {
    var m = {};
    document.cookie.split('; ').forEach(function (p) { var i = p.indexOf('='); if (i > 0) m[p.slice(0, i)] = p.slice(i + 1); });
    return m;
  }
  function b64(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function pipe(bytes, stream) { return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer(); }
  // 'z' + base64(deflate-raw(JSON)) where CompressionStream exists, else 'j' + URI-encoded JSON.
  function encode(v) {
    var json = JSON.stringify(v);
    if (typeof CompressionStream !== 'function') return Promise.resolve('j' + encodeURIComponent(json));
    return pipe(new TextEncoder().encode(json), new CompressionStream('deflate-raw'))
      .then(function (buf) { return 'z' + b64(new Uint8Array(buf)); });
  }
  function decode(s) {
    if (s.charAt(0) === 'j') return Promise.resolve(JSON.parse(decodeURIComponent(s.slice(1))));
    if (s.charAt(0) !== 'z') return Promise.reject(new Error('unknown cookie format'));
    return pipe(unb64(s.slice(1)), new DecompressionStream('deflate-raw'))
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function ckLoad() {
    var c = cookies(), n = Number(c[CK + 'n']) || 0, s = '';
    if (!n) return Promise.resolve(null);
    for (var i = 0; i < n; i++) { if (c[CK + i] === undefined) { console.warn('portable store: cookie part ' + i + ' of ' + n + ' missing'); return Promise.resolve(null); } s += c[CK + i]; }
    return decode(s).then(obj, function (e) { console.warn('portable store: cookie unreadable', e); return null; });
  }
  function setCookie(name, value, age) {
    document.cookie = name + '=' + value + '; Path=/store; Max-Age=' + age + '; Secure; SameSite=Lax';
  }
  function ckSave(v) {
    return encode(v).then(function (s) {
      if (s.length > CHUNK * MAXCHUNKS && v.bookmarks) {
        console.warn('portable store: ' + v.bookmarks.length + ' bookmarks are too many for the cookie; '
                     + 'they stay in this browser\'s localStorage only (not shared in Safari)');
        var slim = {}; for (var k in v) if (k !== 'bookmarks') slim[k] = v[k];
        slim.noBm = 1;
        return ckSave(slim);
      }
      if (s.length > CHUNK * MAXCHUNKS) { console.error('portable store: record too big for the cookie'); return false; }
      var n = Math.ceil(s.length / CHUNK), old = Number(cookies()[CK + 'n']) || 0;
      for (var i = 0; i < n; i++) setCookie(CK + i, s.slice(i * CHUNK, (i + 1) * CHUNK), AGE);
      for (var j = n; j < Math.max(old, MAXCHUNKS); j++) setCookie(CK + j, '', 0);
      setCookie(CK + 'n', String(n), AGE);
      var back = cookies(), got = '';
      for (i = 0; i < n; i++) got += back[CK + i] || '';
      if (back[CK + 'n'] !== String(n) || got !== s) { console.error('portable store: the browser refused the cookie'); return false; }
      return true;
    }, function (e) { console.error('portable store: could not encode the cookie', e); return false; });
  }
  /* The newer of the two, written back to the other. Resolves { rec, lsOk, ckOk }. */
  function load() {
    var ls = lsLoad();
    return ckLoad().then(function (ck) {
      var rec = stamp(ck) > stamp(ls) ? ck : (ls || ck || {});
      if (rec.noBm) {   // the cookie could not carry the bookmarks: this browser's own copy, if it has one
        var r2 = {}; for (var k in rec) if (k !== 'noBm') r2[k] = rec[k];
        if (ls && Array.isArray(ls.bookmarks)) r2.bookmarks = ls.bookmarks;
        rec = r2;
      }
      var lsOk = rec === ls ? true : lsSave(rec);
      // ★ Always re-written when there is anything to keep: it restarts Safari's 7-day cookie cap.
      return (stamp(rec) || rec.view || rec.bookmarks ? ckSave(rec) : Promise.resolve(true))
        .then(function (ckOk) { return { rec: rec, lsOk: lsOk, ckOk: ckOk }; });
    });
  }
  function save(rec) {
    rec.at = Date.now();
    var lsOk = lsSave(rec);
    return ckSave(rec).then(function (ckOk) { return lsOk || ckOk; });
  }
  // ── THE SHARED CHUNK CACHE (see the note at the top) ────────────────────────────────────────────
  var CDB = 'vsChunks', CST = 'chunks', CMAX = 512 * 1024, CTOTAL = 1536 * 1024, CKEEP = 2;
  var SHA = /^[0-9a-f]{64}$/, CNAME = /^[a-z0-9-]{1,32}$/;
  var dbp = null;
  function db() {
    if (!dbp) dbp = new Promise(function (res, rej) {
      if (typeof indexedDB === 'undefined') return rej(new Error('no IndexedDB'));
      var q = indexedDB.open(CDB, 1);
      q.onupgradeneeded = function () { q.result.createObjectStore(CST, { keyPath: 'sha' }); };
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { rej(q.error); };
      q.onblocked = function () { rej(new Error('IndexedDB blocked')); };
    }).catch(function (e) { dbp = null; throw e; });
    return dbp;
  }
  function req(r) { return new Promise(function (res, rej) { r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
  function done(tx) { return new Promise(function (res, rej) { tx.oncomplete = res; tx.onerror = tx.onabort = function () { rej(tx.error); }; }); }
  function hex(buf) { var b = new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16); return s; }
  /* ★ The policy, pure: which records to drop so each name keeps its CKEEP newest and all fit in
     CTOTAL. `all` is [{ sha, name, size, used }]. Kept here as one function so it can be tested. */
  function evictions(all) {
    var drop = {}, byName = {}, total = 0;
    all = all.slice().sort(function (a, b) { return b.used - a.used; });   // newest first
    all.forEach(function (c) {
      var n = (byName[c.name] = (byName[c.name] || 0) + 1);
      if (n > CKEEP || total + c.size > CTOTAL) { drop[c.sha] = 1; return; }
      total += c.size;
    });
    return Object.keys(drop);
  }
  function chunkGet(d) {
    if (typeof d.sha !== 'string' || !SHA.test(d.sha)) return Promise.resolve({ ok: false });
    return db().then(function (h) {
      var tx = h.transaction(CST, 'readwrite'), st = tx.objectStore(CST);
      return req(st.get(d.sha)).then(function (c) {
        if (!c || !(c.bytes instanceof ArrayBuffer)) return done(tx).then(function () { return { ok: false }; });
        c.used = Date.now(); st.put(c);                 // ★ most recently used — what eviction keeps
        return done(tx).then(function () { return { ok: true, bytes: c.bytes }; });
      });
    });
  }
  function chunkPut(d) {
    var b = d.bytes;
    if (typeof d.sha !== 'string' || !SHA.test(d.sha) || typeof d.name !== 'string' || !CNAME.test(d.name)
        || !(b instanceof ArrayBuffer) || !b.byteLength || b.byteLength > CMAX || !(crypto && crypto.subtle)) {
      return Promise.resolve({ ok: false });
    }
    return crypto.subtle.digest('SHA-256', b).then(function (dg) {
      if (hex(dg) !== d.sha) { console.warn('portable store: refused a chunk whose bytes do not match its hash'); return { ok: false }; }
      return db().then(function (h) {
        var tx = h.transaction(CST, 'readwrite'), st = tx.objectStore(CST);
        st.put({ sha: d.sha, name: d.name, size: b.byteLength, used: Date.now(), bytes: b });
        return done(tx).then(function () {
          var tx2 = h.transaction(CST, 'readwrite'), st2 = tx2.objectStore(CST), all = [];
          st2.openCursor().onsuccess = function (ev) {
            var cur = ev.target.result;
            if (!cur) { evictions(all).forEach(function (k) { st2.delete(k); }); return; }
            all.push({ sha: cur.value.sha, name: cur.value.name, size: cur.value.size, used: cur.value.used });
            cur.continue();
          };
          return done(tx2);
        }).then(function () { return { ok: true }; });
      });
    });
  }
  window.addEventListener('message', function (e) {
    if (!OK.test(e.origin) || !e.data || typeof e.data.id !== 'number') return;
    var d = e.data;
    if (d.op !== 'chunkGet' && d.op !== 'chunkPut') return;     // the settings listener below has the rest
    (d.op === 'chunkGet' ? chunkGet(d) : chunkPut(d))
      .catch(function (err) { console.warn('portable store: %s failed', d.op, err); return { ok: false }; })
      .then(function (r) {
        r.id = d.id;
        e.source.postMessage(r, e.origin, r.bytes ? [r.bytes] : []);
      });
  });

  /* ★★★ WHAT ANY *.vibeserver.vibesdr.net PAGE MAY WRITE HERE IS BOUNDED (security audit, 2026-10-03).
     Every receiver on a vibesdr.net name can message this frame — and a receiver is a stranger's
     machine — so a write that was taken whole could park megabytes in every listener's store, or hand
     the next server page values of any type. The VIEW keeps only the keys portable.ts VIEW_KEYS
     names (keep the two lists in step), each a plain number, boolean or short string; BOOKMARKS are
     capped in count and size, and a list over the cap is refused rather than cut silently. */
  var VIEW_KEYS = ['palette', 'autoContrast', 'minDb', 'maxDb', 'wfBrightness', 'wfContrast', 'wfSharpness',
    'wfCoarse', 'wfSpeed', 'wfScroll', 'smoothingFrames', 'spatialSmooth', 'peakHold', 'specFloor',
    'specPeakScale', 'specAlpha', 'specRatio', 'specShow', 'vfoColor', 'vfoIntensity', 'vfoFrost', 'freqUnit',
    'volume', 'ctlBg', 'ctlBtn', 'ctlFont', 'ctlSolid'];
  var BM_MAX = 2000, BM_ITEM_MAX = 4096, BM_TOTAL_MAX = 1024 * 1024;
  function cleanView(v) {
    var out = {};
    VIEW_KEYS.forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(v, k)) return;
      var x = v[k];
      if (typeof x === 'boolean' || (typeof x === 'number' && isFinite(x))) out[k] = x;
      else if (typeof x === 'string' && x.length <= 64) out[k] = x;
    });
    return out;
  }
  function cleanBookmarks(list) {
    if (list.length > BM_MAX) return null;
    var out = [], total = 0;
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b || typeof b !== 'object' || Array.isArray(b)) continue;
      var j;
      try { j = JSON.stringify(b); } catch (e) { continue; }
      if (j.length > BM_ITEM_MAX) continue;
      total += j.length;
      if (total > BM_TOTAL_MAX) return null;
      out.push(JSON.parse(j));       // ★ a plain-data copy: nothing but what JSON carries
    }
    return out;
  }

  var queue = Promise.resolve();   // ★ one operation at a time: a read-modify-write must not interleave
  window.addEventListener('message', function (e) {
    if (!OK.test(e.origin) || !e.data || typeof e.data.id !== 'number') return;
    if (e.data.op === 'chunkGet' || e.data.op === 'chunkPut') return;   // the chunk cache's, above
    var d = e.data, r = { id: d.id, ok: false };
    queue = queue.then(function () { return load(); }).then(function (l) {
      var s = l.rec;
      if (d.op === 'get') {
        r.ok = true;
        r.data = { view: s.view || {}, bookmarks: Array.isArray(s.bookmarks) ? s.bookmarks : null,
                   resetAt: s.resetAt || 0, viewAt: s.viewAt || 0 };
        return;
      }
      if (d.op === 'setView' && d.view && typeof d.view === 'object') {
        /* ★★★ STAMP THE VIEW EPOCH, OR "SAVE FOR ALL" REACHES ONLY THE SERVER YOU ARE STANDING ON.
           A per-server override beats MASTER (portable.ts layer 1), and every server the listener has
           ever tweaked holds one — so writing MASTER alone changed nothing anywhere else. Stuart,
           2026-09-21: "I changed the colour to orange on the sony tv and pressed to save for all
           vibesdr.net servers and got a confirmation, but all other servers are still green."
           ★★ A SEPARATE EPOCH FROM resetAt, NOT A REUSE OF IT. resetAt is also read by the BOOKMARK
              side (search.ts clears the list when it advances), so stamping it here would have made
              changing a colour delete the listener's bookmarks on every other server. */
        s.view = cleanView(d.view); s.viewAt = Date.now();
      } else if (d.op === 'setBookmarks' && Array.isArray(d.bookmarks)) {
        var bm = cleanBookmarks(d.bookmarks);
        if (!bm) { console.warn('portable store: refused a bookmark list that is too large'); return; }
        s.bookmarks = bm;
      } else { console.warn('portable store: unknown operation', d.op); return; }
      return save(s).then(function (ok) { r.ok = ok; });
    }).catch(function (err) { console.error('portable store: %s failed', String(d.op), err); })
      .then(function () { e.source.postMessage(r, e.origin); });
  });
})();
</script>
