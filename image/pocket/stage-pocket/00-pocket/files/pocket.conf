# /etc/vibeserver-pocket/pocket.conf — the pocket box's Wi-Fi defaults (read by vibeserver-pocket).
# ★ Edit on the box, or on the card's root partition before first boot. Restart with:
#     sudo systemctl restart vibeserver-pocket
# Name of the OPEN first-boot hotspot (only ever up until a secured one is saved in setup).
SETUP_SSID=VibeServer
# Wi-Fi country (two letters). Setup can change it.
COUNTRY=GB
# 2.4 GHz channel for the box's hotspots (1, 6 or 11 are legal everywhere).
AP_CHANNEL=6
# Seconds NetworkManager gets at boot to join a saved network by itself before this service steps in.
BOOT_GRACE_SEC=35
# On a hotspot: look for a saved network this often (seconds)…
RESCAN_SEC=120
# …and leave the hotspot only after nobody has been connected to it for this long (seconds).
IDLE_SEC=120
# On network 2 or 3: look for a higher-priority network this often (seconds).
UPGRADE_SEC=120
# One join attempt waits this long (seconds).
JOIN_WAIT_SEC=30
