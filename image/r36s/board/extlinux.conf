## VibeSDR R36S handheld. ROCKNIX's boot.scr detects the board and hands over to this file (U-Boot sysboot).
## U-Boot's parser is strict: no trailing spaces, FDT paths with a leading slash. @DISKID@ is filled by build-image.sh.
## rdinit= names a file that does not exist, so the kernel skips its built-in ROCKNIX initramfs and mounts root=
## itself (read-only); init= lays the RAM overlay and starts systemd. See README.md "Boot chain".
## INITRD: /dev, /dev/console and /root only. ROCKNIX's built-in initramfs has no /root, and the kernel mounts root= there.
TIMEOUT 0
DEFAULT VibeSDR
LABEL VibeSDR
  LINUX /KERNEL
  INITRD /vibe-initrd
  FDT /rk3326-gameconsole-eeclone.dtb
  FDTOVERLAYS /overlays/mipi-panel.dtbo /overlays/vibe-r36s.dtbo
  APPEND root=PARTUUID=@DISKID@-02 rootfstype=ext4 ro rootwait rdinit=/vibesdr-no-initramfs init=/usr/lib/vibesdr-r36s/overlay-init console=ttyS2,1500000 quiet loglevel=3 vt.global_cursor_default=0 consoleblank=0 systemd.show_status=false udev.log_level=3 fsck.repair=yes cpufreq.default_governor=schedutil uboot.hwid_adc=${hwid_adc}
