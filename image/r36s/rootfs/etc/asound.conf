# VibeSDR R36S — ALSA's default device MIXES (dmix), so more than one player can open it.
# ★★ WHY (2026-11-06, handheld6's log): the page opens TWO GStreamer audio sinks in WPEWebProcess (WebAudio and a
#    MediaStream player). The rk817 card is a plain hw device; the first sink took hw:0,0 and the second failed with
#    "Device or resource busy" — the speaker stayed silent. dmix lets both open it; plug converts rate/format.
pcm.!default {
    type plug
    slave.pcm "vibemix"
}
pcm.vibemix {
    type dmix
    ipc_key 4836
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}
ctl.!default {
    type hw
    card 0
}
