# ★★★ SSH IS OFF ON A FRESH CARD (Stuart 2026-11-05). vibe-hwd starts sshd only after the owner has set a password
#     through the handheld's menu ({"set":"ssh-password"} → hashed into root's /etc/shadow entry; never logged), and
#     switched it on ({"set":"ssh","on":true}). No default password exists anywhere in the image.
# ★ Host keys are made on the device the first time SSH is switched on, and kept on the state partition.
HostKey /var/lib/vibe-state/ssh/ssh_host_ed25519_key
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
AuthorizedKeysFile .ssh/authorized_keys /var/lib/vibe-state/ssh/authorized_keys
