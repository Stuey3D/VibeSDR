# ★★ "flush, not sync" for the card: Linux's exfat driver has no `flush` mount option (that is vfat's), so the same
#    effect comes from the writeback timers — dirty data reaches the card within ~2 s instead of 30. The engine's own
#    writes are temp + fsync + rename regardless.
vm.dirty_expire_centisecs = 200
vm.dirty_writeback_centisecs = 100
kernel.printk = 3 3 3 3
