# ★★ vibe-hwd owns the power button (short = screen off/on, long = a clean power-off after the engine has saved).
#    logind would otherwise power the handheld off on the first tap, without the engine's save.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
IdleAction=ignore
