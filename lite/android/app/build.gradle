plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def MAIN   = file("../../../android/app/src/main")          // the main app's sources — READ ONLY
def NATIVE = file("../../native")                            // Lite's API-21 prebuilts
def vsCmake = file("../../../vibeserver/CMakeLists.txt").text
def serverVersion = (vsCmake =~ /project\(vibeserver VERSION ([0-9.]+)/)[0][1]
// ★ The pre-release label (b1 → 11.0.0~b1-lite) — see VIBESERVER_PRERELEASE in that file.
def vsPre = (vsCmake =~ /set\(VIBESERVER_PRERELEASE "([A-Za-z0-9]*)"\)/)
if (vsPre.find() && vsPre.group(1)) serverVersion = serverVersion + "~" + vsPre.group(1)

// ★★★ Lite's signing keys — see the note at signingConfigs below.
def liteProps = new Properties()
def litePropsFile = file(findProperty('liteSigningProps') ?:
    "${System.getProperty('user.home')}/Documents/VibeSDR-keys/vibeserver-lite-release.properties")
if (litePropsFile.exists()) litePropsFile.withInputStream { liteProps.load(it) }
def liteKeysOk = ['storeFile', 'oldStoreFile', 'lineageFile'].every { liteProps[it] && file(liteProps[it]).exists() }

android {
    // ★ The NAMESPACE stays com.vibesdr.app: the engine's JNI symbols are Java_com_vibesdr_app_*,
    //   and the shared Kotlin lives in that package. The APPLICATION ID is Lite's own, so both
    //   apps install side by side.
    namespace 'com.vibesdr.app'
    compileSdk 36
    ndkVersion '27.1.12297006'

    /* ★★★ ExpiredTargetSdkVersion DOES NOT APPLY TO THIS APP, AND IT FAILS THE BUILD ANYWAY.
     *
     *  lintVitalRelease runs on every assembleRelease and enforces "Google Play requires that apps
     *  target API level 33 or higher" — a PLAY POLICY. Lite never goes near Play: it is sideloaded
     *  from GitHub, and that is the entire reason it exists as a separate app from the main one
     *  with VibeServer built in.
     *  ★★ THE LOW TARGET IS THE POINT, NOT AN OVERSIGHT. targetSdkVersion 28 is what keeps the old
     *     rules in force — no scoped storage, no background-service and notification restrictions —
     *     so the server runs on e-waste-tier hardware: a 2017 Fire 7 on API 22, an old Bravia.
     *     Raising it to satisfy a policy we are not subject to would break exactly the devices this
     *     app was written for. Stuart, 2026-09-21: "we deliberately used older SDK's to make sure
     *     it was compatible with e-waste tier ancient android devices".
     *  ★ ONE check disabled, not lint. `checkReleaseBuilds false` would switch off every fatal lint
     *    rule including ones that do apply here; this silences the single rule that is asking the
     *    wrong question. */
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId 'com.vibesdr.serverlite'
        // ★ The shared VibeLocalSdrModule reads this (the main app's legacy-package notice). Lite is never legacy.
        buildConfigField 'boolean', 'IS_LEGACY_PACKAGE', 'false'
        minSdkVersion 21            // Android 5.0 — a 2017 Fire 7 is 5.1.1 (API 22)
        targetSdkVersion 28         // ★ sideload-only: old enough that an old tablet's rules apply
        versionCode 46
        versionName serverVersion + "-lite"
        ndk { abiFilters 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          // ★★★ WHICH ANDROID APP THIS IS. The shim reports a `flavour` so the
                          //     directory can name the build, and __ANDROID__ alone cannot tell
                          //     Lite from the main app — BOTH are Android, and they share this very
                          //     CMakeLists. Without this the TV announced itself as "VibeServer
                          //     inside VibeSDR", which is the other app entirely.
                          "-DVIBE_LITE_APP=ON",
                          "-DSDR_KIT_ROOT=${NATIVE}/kit",
                          "-DOPUS_A=${NATIVE}/opus/lib/armeabi-v7a/libopus.a"
            }
        }
    }
    externalNativeBuild { cmake { path "${MAIN}/cpp/CMakeLists.txt"; version '3.22.1' } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // ★ cloudflared is an EXECUTABLE named lib*.so; it must be extracted to nativeLibraryDir to run.
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets {
        main {
            java.srcDirs += ["${buildDir}/shared-src"]
            res.srcDirs  += ["${buildDir}/shared-res"]
            jniLibs.srcDirs += ["${buildDir}/lite-jniLibs"]
            assets.srcDirs  += ["${buildDir}/rn-assets", "${buildDir}/rn-fonts"]
            res.srcDirs     += ["${buildDir}/rn-res"]
        }
    }
    // ★★★ LITE'S OWN RELEASE KEY, ROTATED FROM THE OLD ONE (2026-10-03, from V11 RC4). Until RC3 Lite was
    //     signed with this Mac's debug key. Stuart: "I want the simplest option for our users" — so RC4
    //     must install OVER any older Lite and keep its settings, directory listing and address.
    //     ★ Android 9+ reads the v3 signature: the NEW key, plus a lineage the old key signed ("this key
    //       now speaks for me"), so an update is accepted and only the new key is trusted after it.
    //     ★ Android 5–8 cannot read v3; they check the v1/v2 signatures, which stay on the OLD key.
    //       So while minSdk < 28 EVERY Lite release is signed with BOTH keys — do not drop the old one.
    //     Keys, passwords and lineage live ONLY in ~/Documents/VibeSDR-keys (Time Machine + iCloud) and
    //     are read in place, never copied. Override with -PliteSigningProps=… . No file = a release
    //     build REFUSES.
    // (the keys are loaded at the top of this file — liteProps / liteKeysOk)
    signingConfigs {
        if (liteKeysOk) {
            // gradle signs with the OLD key; signLiteRelease below re-signs with both + the lineage.
            liteOld {
                storeFile file(liteProps['oldStoreFile'])
                storePassword liteProps['oldStorePassword']
                keyAlias liteProps['oldKeyAlias']
                keyPassword liteProps['oldKeyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (liteKeysOk) signingConfig signingConfigs.liteOld
            minifyEnabled false
        }
    }
}

gradle.taskGraph.whenReady { g ->
    if (g.allTasks.any { it.name.toLowerCase().contains('release') } && !android.signingConfigs.findByName('liteOld'))
        throw new GradleException("Lite release keys missing: expected ~/Documents/VibeSDR-keys/vibeserver-lite-release.properties with both keys and the lineage (or -PliteSigningProps=…)")
}

// ★★★ The APK in outputs/ is ALWAYS the rotated one: assembleRelease cannot finish without this step,
//     and it verifies its own result (v3 signer = the new key, v1/v2 = the old) before it succeeds.
tasks.register('signLiteRelease') {
    doLast {
        def p = liteProps
        def apksigner = "${android.sdkDirectory}/build-tools/${android.buildToolsVersion}/apksigner"
        def dir = file("${buildDir}/outputs/apk/release")
        def apk = new File(dir, 'app-release.apk')
        if (!apk.exists()) throw new GradleException("signLiteRelease: no ${apk}")
        def tmp = new File(dir, 'app-release.rotated.apk')
        // ★ A failure must not leave an old-key-only APK in outputs/ looking finished.
        def fail = { String m -> apk.delete(); tmp.delete(); throw new GradleException(m) }
        def env = [OLDPW: p['oldStorePassword'], OLDKP: p['oldKeyPassword'], NEWPW: p['storePassword'], NEWKP: p['keyPassword']]
        def run = { List cmd ->
            def pb = new ProcessBuilder(cmd.collect { it.toString() }).redirectErrorStream(true)
            pb.environment().putAll(env)
            def pr = pb.start(); def out = pr.inputStream.text
            if (pr.waitFor() != 0) fail("apksigner failed:\n${out}")
            out
        }
        try {
            run([apksigner, 'sign',
                 '--ks', p['oldStoreFile'], '--ks-key-alias', p['oldKeyAlias'], '--ks-pass', 'env:OLDPW', '--key-pass', 'env:OLDKP',
                 '--next-signer',
                 '--ks', p['storeFile'], '--ks-key-alias', p['keyAlias'], '--ks-pass', 'env:NEWPW', '--key-pass', 'env:NEWKP',
                 '--lineage', p['lineageFile'], '--rotation-min-sdk-version', '28', '--v4-signing-enabled', 'false',
                 '--out', tmp.path, apk.path])
            // As Android 9+ sees it: v3, the NEW key. As Android 5–8 see it: v1/v2, the OLD key.
            def v = run([apksigner, 'verify', '-v', '--print-certs', tmp.path])
            def vOld = run([apksigner, 'verify', '-v', '--print-certs', '--max-sdk-version', '27', tmp.path])
            if (!v.contains('Verified using v3 scheme (APK Signature Scheme v3): true') ||
                !v.contains('25a55af72ea9b8fef55dd0098ad2168a740b09844a7bbc151815f2c99ec2f8b3') ||
                !vOld.contains('d64da39b919d463a1582b68e88d369b3e377c57ca2b1db83a606ad46430a9214'))
                fail("signLiteRelease: the rotated APK does not carry both keys:\n${v}\n--- Android 5-8 view ---\n${vOld}")
        } catch (Throwable e) { apk.delete(); tmp.delete(); throw e }
        apk.delete(); tmp.renameTo(apk)
        logger.lifecycle("Lite release signed with both keys (old v1/v2, new v3 + lineage)")
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { finalizedBy 'signLiteRelease' }

// ★★ THE SHARED KOTLIN IS SYNCED, NOT COPIED INTO THE REPO. These are the React-free files that
//    start and keep a VibeServer; Lite compiles the main app's own copies, so a fix there is a fix
//    here. Anything that imports React or Expo stays out.
def SHARED = ['VibeLocalSDR.kt', 'VibeServerBoot.kt', 'VibeServerRestore.kt', 'RtlTcpServerService.kt',
              'VibeTunnel.kt', 'VibeGeoData.kt', 'VibeHttp.kt', 'VibeWifiLock.kt',
              // ★★ Modern roots for old phones' HTTPS (B10: a Lite on Android 5.1 had no RIPE/APNIC data).
              //    Every downloader above uses it — without this line none of them compiles.
              'VibeTls.kt',
              // ★ stage 2: the bridge modules ServerModeScreen talks to — the main app's own files.
              //   They import only React's classic bridge API, which 0.73 has.
              'VibeLocalSdrModule.kt', 'VibeMdnsModule.kt',
              // ★ Puts a running server back after an update (MY_PACKAGE_REPLACED). Missing from Lite, so a
              //   reinstall left a TV box's server stopped until somebody walked to it (2026-09-19).
              'VibeUpdateReceiver.kt',
              // ★ Start when power returns — Android 5.0–7.0 only (VibeBootReceiver lives in this file; the
              //   removed 2026-09-28 version promised it everywhere, and modern Android refuses the radio at boot).
              'VibeBootStart.kt',
              // ★★ The server benchmark VibeLocalSdrModule calls (runBenchmark/lastBenchmark). Missing from
              //    this list, the module does not compile at all — and gradle stops with the PREVIOUS APK still
              //    sitting in outputs/, which is exactly how a stale build once shipped as a new one.
              'VibeBenchmark.kt',
              // ★★★ The GPU map: asset unpack + the JNI downloader for the High Detail pack.
              'VibeMapGL.kt']
tasks.register('syncShared', Sync) {
    from("${MAIN}/java/com/vibesdr/app") { include SHARED }
    into "${buildDir}/shared-src/com/vibesdr/app"
}
tasks.register('syncSharedRes', Sync) {
    from("${MAIN}/res/xml") { include 'device_filter.xml' }
    into "${buildDir}/shared-res/xml"
}
tasks.register('syncJniLibs', Sync) {
    // ★★★ FAIL LOUDLY WITHOUT THE TUNNEL. cloudflared is gitignored (27 MB), so a fresh clone or an agent's
    //   worktree has none — and Sync just skips a missing file: the APK built, installed and ran, then
    //   logged "listing not restored: the tunnel component is not present in this build" and dropped the
    //   Sony out of the directory (2026-10-01). A Lite with no tunnel is never what we meant to build.
    doFirst {
        ['cloudflared/armeabi-v7a/libcloudflared.so', 'kit/armeabi-v7a/lib/librtlsdr.so',
         'kit/armeabi-v7a/lib/libusb1.0.so'].each { rel ->
            if (!new File(NATIVE, rel).exists())
                throw new GradleException("Lite: ${NATIVE}/${rel} is missing — copy it from the main checkout " +
                                          "(lite/native is partly gitignored); refusing to build a Lite without it")
        }
    }
    from("${NATIVE}/kit/armeabi-v7a/lib") { include 'librtlsdr.so', 'libusb1.0.so' }
    from("${NATIVE}/cloudflared/armeabi-v7a") { include 'libcloudflared.so' }
    into "${buildDir}/lite-jniLibs/armeabi-v7a"
}
// ★ THE JS IS THE MAIN APP'S ServerModeScreen, bundled by Metro from lite/app (see its index.js).
tasks.register('bundleJs', Exec) {
    workingDir file('../../app')
    inputs.dir(file('../../../src')); inputs.file(file('../../app/index.js')); inputs.file(file('../../app/metro.config.js'))
    outputs.dir("${buildDir}/rn-assets"); outputs.dir("${buildDir}/rn-res")
    doFirst { mkdir "${buildDir}/rn-assets"; mkdir "${buildDir}/rn-res" }
    commandLine 'npx', 'react-native', 'bundle', '--platform', 'android', '--dev', 'false',
                '--entry-file', 'index.js',
                '--bundle-output', "${buildDir}/rn-assets/index.android.bundle",
                '--assets-dest', "${buildDir}/rn-res"
}
tasks.register('syncFonts', Sync) {
    // the main app loads these through expo-font under these FAMILY names; on Android a file in
    // assets/fonts is addressable by its base name, so the files are renamed to the family.
    from(file('../../../assets/fonts')) { include 'AtkinsonHyperlegible-Regular.ttf'; rename { 'Atkinson Hyperlegible.ttf' } }
    from(file('../../../assets/fonts')) { include 'NixieOne-Regular.ttf'; rename { 'Nixie One.ttf' } }
    into "${buildDir}/rn-fonts/fonts"
}
preBuild.dependsOn syncShared, syncSharedRes, syncJniLibs, bundleJs, syncFonts
// ★★★ The GPU map files the server serves at /mapgl/ — the MAIN app's script, so both APKs carry the
//     same pack by construction (briefs/BRIEF-server-gpu-maps.md §2).
apply from: "${MAIN}/../../mapgl-assets.gradle"

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'      // the main app's version (VibeHttp)
    implementation "com.facebook.react:react-android:${rootProject.ext.RN_VERSION}"
    implementation "com.facebook.react:hermes-android:${rootProject.ext.RN_VERSION}"
    implementation project(':async-storage')
    implementation project(':slider')
    implementation project(':safe-area-context')
}
