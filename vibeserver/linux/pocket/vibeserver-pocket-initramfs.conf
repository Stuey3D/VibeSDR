# vibeserver-pocket-initramfs.conf — installed as /usr/share/initramfs-tools/conf.d/vibeserver-pocket (2026-10-13).
#
# ★★★ WHY. A Portable's Update runs apt inside overlayroot-chroot (vibeserver-maintenance, apt_do). Raspberry Pi OS
#     sets MODULES=dep, and dep mode asks "which device is / ?" — which inside that chroot has no answer. The first
#     Update after 88b3b75e installed system packages, the initramfs trigger ran, and dpkg stopped:
#       mkinitramfs: failed to determine device for /
#       dpkg: error processing package initramfs-tools (--configure)
#     (Stuart's Portable, 2026-10-13 23:30.) The old initramfs was left in place, so the box still booted — but
#     every later Update would fail the same way, and a kernel upgrade would be left without its initramfs.
#  ★ The fix is mkinitramfs's own suggested workaround, MODULES=most, ONLY when both hold:
#     · the Portable marker is on the real root, and
#     · the RUNNING system is the sealed overlay (overlayroot=tmpfs on the kernel command line — /proc is bound into
#       the chroot, so this reads the live box) — i.e. exactly an Update's chroot.
#    Anywhere else — an ordinary server, the image build, a Portable before it is sealed — dep stays as it was.
#  ★ Measured on the Pi 500 (6.18.39-2712): dep 18.5 MB, most 22.9 MB. The boot partition is 512 MB.
#  ★ From /usr/share (the PACKAGE path; mkinitramfs sources it after initramfs.conf), so an owner's own
#    /etc/initramfs-tools/conf.d file of the same name still wins. This file is also copied into the initramfs and
#    sourced at boot, where neither condition holds — it does nothing there.
#  ★★ It ships in the package, so it is on disk BEFORE dpkg re-tries the failed initramfs-tools configure: the next
#     Update clears a box stuck in that state without needing the new vibeserver-maintenance to be running.
if [ -f /etc/vibeserver-pocket/enabled ] && grep -qw "overlayroot=tmpfs" /proc/cmdline 2>/dev/null; then
	MODULES=most
fi
