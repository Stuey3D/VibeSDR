# ★★★ THE KERNEL'S DVB DRIVER MUST NEVER TOUCH AN RTL2832U THAT VIBESERVER USES AS AN SDR.
#
# Without this, dvb_usb_rtl28xxu binds the dongle every time VibeServer closes it — a unit
# restart, a sample-rate rebuild, leaving DAB — and races our reopen. On the Pi 500, 2026-09-09,
# the race lost twice in a day: "dvb_usb_rtl28xxu 1-2:1.0: chip type detection failed -110" and
# the V4 then answered librtlsdr as "Generic RTL2832U OEM, serial (none)" until a USB reset.
# Every apt release restarts all four units at once, which is exactly the window.
# The same list every RTL-SDR install guide gives; librtlsdr's own udev rule does not do this.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist rtl2832_sdr
