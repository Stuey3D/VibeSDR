# VibeServer options — edit here, or use the TUI (`vibeserver` with no arguments).
#
# ★ Everything after --  is passed straight to the binary; run `vibeserver --help` for the full list.
#   Leave VIBESERVER_ARGS empty for sensible defaults: it finds whatever radio is plugged in,
#   picks the first free port from 48000, and serves the web client with no PIN.
#
# Examples:
#   VIBESERVER_ARGS="--port 8073 --pin hunter2"
#   VIBESERVER_ARGS="--rate 912000 --freq 9410000 --mode am"
#   VIBESERVER_ARGS="--lock-rate 912000 --max-fps 15"      # pin what listeners may ask for

VIBESERVER_ARGS=""
